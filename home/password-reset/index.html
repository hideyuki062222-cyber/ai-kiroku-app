<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#173f46">
<title>パスワードの再設定 | NEXIA</title>
<link rel="stylesheet" href="../style.css?v=20261126-recovery">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script defer src="./app.js?v=20261126-1"></script>
</head>
<body>
<a class="skip" href="#main">本文へ移動</a>
<div class="shell">
  <header class="header">
    <div class="brand"><span class="mark" aria-hidden="true">N</span><div><h1>NEXIA <span>ネクシア</span></h1></div></div>
  </header>
  <main id="main">
    <section class="panel login" aria-labelledby="resetTitle">
      <h2 id="resetTitle">パスワードの再設定</h2>
      <p id="resetStatus" class="notice" role="status" aria-live="polite" hidden></p>
      <form id="resetRequest" method="post">
        <label for="resetEmail">登録メールアドレス</label>
        <input id="resetEmail" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="254">
        <button id="sendCode" class="button primary" type="submit" disabled>確認コードを送る</button>
        <button id="useCode" class="button secondary recovery-option" type="button" disabled>確認コードをお持ちの方</button>
      </form>
      <form id="resetVerify" method="post" hidden>
        <label for="verifyEmail">登録メールアドレス</label>
        <input id="verifyEmail" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="254">
        <label for="resetCode">メールに届いた確認コード</label>
        <input id="resetCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" required>
        <button id="verifyCode" class="button primary" type="submit">確認する</button>
        <button id="sendAgain" class="button secondary recovery-option" type="button">メールアドレスの確認・再送</button>
      </form>
      <form id="resetPassword" method="post" hidden>
        <p class="muted" id="passwordHint">12文字以上で設定してください。</p>
        <label for="newPassword">新しいパスワード</label>
        <input id="newPassword" type="password" autocomplete="new-password" aria-describedby="passwordHint" minlength="12" required>
        <label for="confirmPassword">新しいパスワード（確認）</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
        <button id="savePassword" class="button primary" type="submit">パスワードを変更する</button>
      </form>
      <a id="resetBack" class="text-link" href="../">ログイン画面へ戻る</a>
    </section>
  </main>
</div>
</body>
</html>
