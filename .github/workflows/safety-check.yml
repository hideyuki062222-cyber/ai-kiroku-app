name: Safety Check

on:
  push:
    branches:
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check common-nav.js
          node --check admin-link.js
          node --check client-room-ui.js
          node --check record-safety.js
          node --check care-intro-addon.js
          node --check assignment-context-guard.js
          node --check assignment/safety-addon.js
          node --check cashbook/safety-addon.js
          node --check handoff/safety-addon.js
      - name: Check HTML inline JavaScript syntax
        run: node tests/html_inline_syntax.cjs
      - name: Check navigation consistency
        run: node tests/navigation_consistency.cjs
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run safety contract tests
        run: python -m pytest -q tests/test_system_safety.py tests/test_care_intro.py
