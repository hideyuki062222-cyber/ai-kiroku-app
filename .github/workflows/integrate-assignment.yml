name: Integrate assignment into AI record

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-assignment.yml'

permissions:
  contents: write

jobs:
  patch-root-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add assignment navigation and handoff to AI record
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '.app-nav{display:grid;grid-template-columns:repeat(3,1fr);',
              '.app-nav{display:grid;grid-template-columns:repeat(4,1fr);'
          )

          old_nav = '''    <nav class="app-nav" aria-label="アプリ切替">
      <a class="app-tab" href="./handoff/">申し送り</a>
      <a class="app-tab active" href="./">AI記録</a>
      <a class="app-tab" href="./cashbook/">出納帳</a>
    </nav>'''
          new_nav = '''    <nav class="app-nav" aria-label="アプリ切替">
      <a class="app-tab" href="./assignment/">担当割当</a>
      <a class="app-tab" href="./handoff/">申し送り</a>
      <a class="app-tab active" href="./">AI記録</a>
      <a class="app-tab" href="./cashbook/">出納帳</a>
    </nav>'''
          if old_nav in s:
              s = s.replace(old_nav, new_nav, 1)

          context_card = '''
  <section class="card hidden" id="assignmentContextCard">
    <label>担当割当から引き継ぎ</label>
    <div class="notice" id="assignmentContextText"></div>
    <div class="actions">
      <button class="secondary" onclick="location.href='./assignment/'">担当割当へ戻る</button>
    </div>
  </section>
'''
          cloud_end = '''  </section>

  <section class="card" id="myStaffCard">'''
          if 'id="assignmentContextCard"' not in s and cloud_end in s:
              s = s.replace(cloud_end, '  </section>\n' + context_card + '\n  <section class="card" id="myStaffCard">', 1)

          assignment_js = r'''
function applyAssignmentContext(){
  const q=new URLSearchParams(location.search);
  if(q.get("from")!=="assignment") return;
  const ctx={
    assignmentId:q.get("assignment")||"",
    client:q.get("client")||"",
    date:q.get("date")||"",
    time:q.get("time")||"",
    staff:q.get("staff")||"",
    memo:q.get("memo")||"",
    label:q.get("label")||""
  };
  window.assignmentContext=ctx;

  const card=document.getElementById("assignmentContextCard");
  const text=document.getElementById("assignmentContextText");
  if(card) card.classList.remove("hidden");
  if(text) text.textContent=`${ctx.date||""} ${ctx.time||""} / ${ctx.client||""} / 担当：${ctx.staff||"未設定"}${ctx.memo?" / メモ："+ctx.memo:""}`;

  const userSel=document.getElementById("user");
  const profileSel=document.getElementById("profileUser");
  if(ctx.client && users.includes(ctx.client)){
    if(userSel) userSel.value=ctx.client;
    if(profileSel){profileSel.value=ctx.client;loadProfile();}
  }

  const inputEl=document.getElementById("input");
  if(inputEl && ctx.memo && !inputEl.value.trim()){
    inputEl.value=ctx.memo;
    const count=document.getElementById("inputCount");
    if(count) count.textContent=inputEl.value.length+"文字";
  }

  const label=(ctx.label||"");
  const map=[
    ["起床","起床介助"],["就寝","就寝介助"],["排泄","トイレ介助"],["トイレ","トイレ介助"],
    ["食介","食事介助"],["食事","食事介助"],["入浴","入浴介助"],["更衣","更衣介助"],
    ["服薬","服薬介助・確認"],["口腔","口腔ケア"],["家事","家事援助"],["通院","通院等介助"]
  ];
  for(const [key,value] of map){
    if(label.includes(key)){
      const cb=[...document.querySelectorAll('input[name="serviceContent"]')].find(x=>x.value===value);
      if(cb) cb.checked=true;
    }
  }
}
'''
          marker = 'refreshUserSelect();\n</script>'
          if 'function applyAssignmentContext()' not in s and marker in s:
              s = s.replace(marker, assignment_js + '\nrefreshUserSelect();\n</script>', 1)

          old_refresh = '''    refreshUserSelect();
  }

  async function loadCloudHistory(){'''
          new_refresh = '''    refreshUserSelect();
    applyAssignmentContext();
  }

  async function loadCloudHistory(){'''
          if old_refresh in s:
              s = s.replace(old_refresh, new_refresh, 1)

          old_payload = '''      support_method_snapshot:record.supportMethodSnapshot || "",
      visit_note:record.visitNote || "",
      care_note:record.careNote || ""
    };'''
          new_payload = '''      support_method_snapshot:record.supportMethodSnapshot || "",
      visit_note:record.visitNote || "",
      care_note:record.careNote || "",
      service_date:window.assignmentContext?.date || null,
      service_time:window.assignmentContext?.time || null,
      assignment_id:window.assignmentContext?.assignmentId || null
    };'''
          if old_payload in s:
              s = s.replace(old_payload, new_payload, 1)

          old_saved = '''    const { error } = await client.from("care_records").insert(payload);
    if(error) throw error;
    await loadCloudHistory();'''
          new_saved = '''    const { error } = await client.from("care_records").insert(payload);
    if(error) throw error;
    if(window.assignmentContext){
      const text=document.getElementById("assignmentContextText");
      if(text && !text.textContent.includes("記録保存済み")) text.textContent += " / ✓ 記録保存済み";
    }
    await loadCloudHistory();'''
          if old_saved in s:
              s = s.replace(old_saved, new_saved, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify patched HTML
        shell: bash
        run: |
          grep -q './assignment/' index.html
          grep -q 'function applyAssignmentContext' index.html
          grep -q 'assignment_id:window.assignmentContext' index.html

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Integrate staff assignment with AI records"
            git push
          fi

