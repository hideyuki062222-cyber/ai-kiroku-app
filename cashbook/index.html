<html lang="ja">
<head>

<meta name="theme-color" content="#17365d">
<title>利用者 金銭出納帳</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<style>

body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:var(--bg);color:var(--text)}
.hidden{display:none!important}.wrap{max-width:980px;margin:0 auto;padding:14px 12px 90px}.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);padding:9px 12px}.topline{max-width:980px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:14px}.top-brand{min-width:0}.brand{font-weight:900;font-size:19px}.sub,.small{color:var(--muted);font-size:12px;line-height:1.5}.sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{display:flex;align-items:center;gap:8px}.app-nav{display:grid;grid-template-columns:repeat(3,auto);gap:3px;background:#eef2f7;border-radius:12px;padding:3px}.app-tab{display:block;text-decoration:none!important;color:#506078;padding:8px 11px;border-radius:9px;font-size:13px;font-weight:850;white-space:nowrap}.app-tab.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px #00000014}.utility-actions{display:flex;gap:4px}.utility-actions .btn{padding:8px 9px;font-size:12px;white-space:nowrap}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:800;color:#26364d;cursor:pointer}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.red{background:#fff0f2;border-color:#f2c8cf;color:#9f2438}.btn.green{background:#e9f7ef;border-color:#bfe5cf;color:#16683f}.btn:disabled{opacity:.55}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #00000008}
.client-label{font-weight:900;font-size:14px;margin-bottom:7px}.client-select{width:100%;min-height:58px;border:2px solid var(--blue);border-radius:12px;background:#eef5ff;color:var(--navy);font-size:18px;font-weight:900;padding:11px 13px}
.balance-box{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.metric{border-radius:13px;padding:11px;background:#f7f9fc;border:1px solid var(--line)}.metric .k{font-size:11px;color:var(--muted);font-weight:800}.metric .v{font-size:20px;font-weight:950;margin-top:3px}.metric.balance{background:#eef5ff;border-color:#c6d9f7}.metric.balance .v{color:#164e96}.metric.in .v{color:var(--green)}.metric.out .v{color:var(--red)}
.segment{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px}.seg{min-height:50px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:17px;font-weight:900}.seg.active.expense{background:#fff0f2;border-color:#e68f9b;color:#a32236}.seg.active.income{background:#eaf8f0;border-color:#84c9a4;color:#11653a}
.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #cfd8e4;border-radius:11px;padding:12px;font-size:16px;background:#fff}.field-label-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.field-label-row label{margin:0}.add-master{border:1px solid #b8c9df;background:#eef5ff;color:#174f96;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}.master-note{font-size:11px;color:#6b7788;margin-top:5px}.field textarea{min-height:70px;resize:vertical}
.amount-input{font-size:22px!important;font-weight:950!important;text-align:right;min-height:46px;border:1px solid #aabbd1!important;padding:9px 11px!important}.date-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.input-card{padding:12px}.input-card .section-title{font-size:16px;margin-bottom:7px}.input-card .field{margin:8px 0}.input-card .field label{margin-bottom:4px}.input-card input[type="date"]{min-height:44px;padding:8px 10px}.compact-segment{margin:5px 0 8px}.compact-segment .seg{min-height:40px;font-size:14px;padding:6px}
.picker-button{width:100%;min-height:46px;border:1px solid #b8c7da;border-radius:10px;background:#fff;padding:9px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;font-size:15px;font-weight:850;color:#27384f}.picker-button .placeholder{color:#7a8797;font-weight:700}.picker-button .arrow{color:#64748b}.picker-button.selected{border-color:#7ba0d5;background:#f7faff;color:#17365d}.compact-note{font-size:10px;color:#7a8797;margin-top:3px}.optional-toggle{margin-top:7px}.optional-toggle summary{font-size:12px;color:#5f6f84;font-weight:800;cursor:pointer}.optional-toggle .field{margin-top:7px}.optional-toggle textarea{min-height:55px;padding:9px 10px;font-size:14px}
.quick-title{font-size:12px;font-weight:900;color:#5c6d83;margin:7px 0 5px}.quick-list{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.quick-list::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid #cbd6e4;background:#f8fafc;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}
.save{width:100%;min-height:54px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-size:17px;font-weight:900;margin-top:8px}
.status{font-size:12px;margin-top:8px;color:#536177;min-height:18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.toolbar .field{margin:0;flex:1;min-width:130px}.toolbar input{min-height:43px}
.history{margin-top:10px}.entry{border-top:1px solid #e8edf3;padding:11px 0}.entry:first-child{border-top:0}.entry-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.entry-date{font-size:12px;color:var(--muted);font-weight:800}.entry-title{font-size:15px;font-weight:900;margin-top:3px}.entry-sub{font-size:12px;color:#64748b;margin-top:4px}.entry-money{text-align:right;white-space:nowrap}.entry-money .amt{font-size:17px;font-weight:950}.entry-money .amt.out{color:var(--red)}.entry-money .amt.in{color:var(--green)}.entry-money .bal{font-size:12px;color:#536177;margin-top:3px}.entry-actions{display:flex;gap:6px;margin-top:8px}.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:800}
.empty{text-align:center;color:var(--muted);padding:25px 8px}.section-title{font-size:17px;font-weight:950;margin-bottom:10px}
.adminbox{background:#fffaf0;border-color:#f0ddb2}.adminrow{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.adminrow .field{flex:1;min-width:160px;margin:0}.adminrow input{font-size:18px;text-align:right}
.auth{position:fixed;inset:0;z-index:100;background:#f3f6fa;display:flex;align-items:center;justify-content:center;padding:18px}.authbox{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 40px #0001}.authbox input{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd6e2;border-radius:10px;font-size:16px}.auth-actions{display:flex;gap:8px;margin-top:10px}.auth-actions button{flex:1}
.overlay{position:fixed;inset:0;z-index:80;background:#0007;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(600px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px}.row-between{display:flex;justify-content:space-between;gap:8px;align-items:center}
.picker-search{width:100%;border:1px solid #cad5e2;border-radius:10px;padding:10px 11px;font-size:15px;margin:10px 0}.picker-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.picker-choice{border:1px solid #d3dce8;background:#fff;border-radius:10px;padding:10px 8px;font-size:14px;font-weight:850;text-align:left;min-height:42px}.picker-choice:active{background:#edf4ff}.picker-add{width:100%;margin-top:10px;border:1px dashed #7aa2d8;background:#eef5ff;color:#174f96;border-radius:10px;padding:10px;font-weight:900}.picker-empty{grid-column:1/-1;text-align:center;color:#7a8797;padding:18px 8px}
@media(max-width:680px){.top{padding:8px 10px}.topline{display:block}.top-brand{margin-bottom:7px}.brand{font-size:18px}.header-right{display:block}.app-nav{grid-template-columns:repeat(3,1fr);width:100%}.app-tab{text-align:center;padding:8px 5px;font-size:13px}.utility-actions{justify-content:flex-end;margin-top:5px}.utility-actions .btn{padding:6px 8px;font-size:11px}.sub{max-width:100%}}
@media(max-width:520px){.input-card{padding:10px}.input-card .save{min-height:46px;font-size:15px}.brand{font-size:17px}.top-actions .btn{padding:8px 9px;font-size:12px}.balance-box{grid-template-columns:1fr 1fr}.metric.balance{grid-column:1/-1}.metric.balance .v{font-size:25px}.date-row{grid-template-columns:1fr}.entry-title{font-size:14px}.amount-input{font-size:26px!important}}
@media(min-width:700px){.wrap{padding-top:18px}.sheet{border-radius:18px;margin-bottom:18px}.overlay{align-items:center}}
.print-report{display:none}
.print-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:5px}.print-title{font-size:15px;font-weight:900}.print-meta{font-size:9px;color:#444}.print-summary{display:flex;gap:12px;font-size:9px;margin:3px 0 6px}.print-summary b{font-size:10px}.print-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:8.5px;line-height:1.15}.print-table th,.print-table td{border:1px solid #777;padding:2px 3px;vertical-align:top;word-break:break-word}.print-table th{background:#f1f1f1;font-weight:900;text-align:center}.print-table .num{text-align:right;white-space:nowrap}.print-table .date{white-space:nowrap;text-align:center}
@media print{
 @page{size:A4 portrait;margin:6mm}
 body{background:#fff;color:#000;font-size:9px}
 .top,.input-card,.adminbox,.history-card,.card:not(.print-report),.overlay{display:none!important}
 .wrap{max-width:none!important;margin:0!important;padding:0!important}
 .print-report{display:block!important;margin:0!important;padding:0!important;border:0!important;box-shadow:none!important}
 .print-head{margin:0 0 4px}.print-title{font-size:14px}.print-meta{font-size:8px}
 .print-summary{font-size:8px;margin:2px 0 4px;gap:10px}.print-summary b{font-size:9px}
 .print-table{font-size:7.8px;line-height:1.08}
 .print-table th,.print-table td{padding:1.5px 2px}
 .print-table thead{display:table-header-group}
 .print-table tr{break-inside:avoid;page-break-inside:avoid}
}
</style>
</head>
<body>

<div id="auth" class="auth hidden">
  <div class="authbox">
    <h2 style="margin-top:0">利用者 金銭出納帳</h2>
    <div class="small">AI記録・申し送りと同じアカウントでログインできます。</div>
    <input id="email" type="email" placeholder="メールアドレス">
    <input id="password" type="password" placeholder="パスワード">
    <div class="auth-actions"><button class="btn primary" onclick="login()">ログイン</button><button class="btn" onclick="signup()">新規登録</button></div>
    <div id="authMsg" class="status"></div>
  </div>
</div>

<header class="top">
 <div class="topline">
  <div class="top-brand"><div class="brand">金銭出納帳</div><div id="orgLabel" class="sub">読み込み中…</div></div>
  <div class="header-right">
    <nav class="app-nav" aria-label="アプリ切替">
      <a class="app-tab" href="../handoff/">申し送り</a>
      <a class="app-tab" href="../">AI記録</a>
      <a class="app-tab active" href="./">出納帳</a>
    </nav>
    <div class="utility-actions">
      <button class="btn" onclick="printCashbook()">印刷</button>
      <button class="btn" onclick="logout()">退出</button>
    </div>
  </div>
 </div>
</header>

<main id="app" class="wrap hidden">
  <section class="card">
    <div class="client-label">👤 利用者を選択</div>
    <select id="clientSelect" class="client-select" onchange="changeClient(this.value)"></select>
    <div class="balance-box">
      <div class="metric balance"><div class="k">現在残高</div><div id="currentBalance" class="v">¥0</div></div>
      <div class="metric in"><div class="k">今月の入金</div><div id="monthIncome" class="v">¥0</div></div>
      <div class="metric out"><div class="k">今月の支出</div><div id="monthExpense" class="v">¥0</div></div>
    </div>
  </section>

  <section class="card input-card">
    <div class="section-title">＋ 入出金を登録</div>
    <div class="segment compact-segment">
      <button id="expenseBtn" class="seg expense active" onclick="setKind('expense')">－ 支出</button>
      <button id="incomeBtn" class="seg income" onclick="setKind('income')">＋ 入金</button>
    </div>

    <div class="field">
      <label>1．日付</label>
      <input id="txDate" type="date">
    </div>

    <div class="field">
      <label>2．店名・支払先</label>
      <input id="store" type="hidden">
      <button id="storePickerBtn" class="picker-button" type="button" onclick="openPicker('store')"><span id="storePickerText" class="placeholder">タップして店名を選択</span><span class="arrow">▼</span></button>
    </div>

    <div class="field">
      <label>3．品名・内容</label>
      <input id="item" type="hidden">
      <button id="itemPickerBtn" class="picker-button" type="button" onclick="openPicker('item')"><span id="itemPickerText" class="placeholder">タップして品名を選択</span><span class="arrow">▼</span></button>
    </div>

    <div class="field">
      <label>4．金額</label>
      <input id="amount" class="amount-input" type="number" inputmode="numeric" min="1" step="1" placeholder="0">
    </div>

    <details class="optional-toggle">
      <summary>備考を入力する（任意）</summary>
      <div class="field"><textarea id="memo" maxlength="300" placeholder="必要な時だけ入力"></textarea></div>
    </details>

    <button id="saveBtn" class="save" onclick="saveEntry()">保存する</button>
    <div id="saveStatus" class="status"></div>
  </section>

  <section id="adminCard" class="card adminbox hidden">
    <div class="section-title">⚙ 開始残高の設定</div>
    <div class="small">この利用者の出納帳を始める時点の残高です。管理者だけ変更できます。</div>
    <div class="adminrow" style="margin-top:9px">
      <div class="field"><label>開始残高</label><input id="openingBalance" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></div>
      <button class="btn primary" onclick="saveOpeningBalance()">保存</button>
    </div>
    <div id="adminStatus" class="status"></div>
  </section>

  <section id="printReport" class="card print-report">
    <div class="print-head">
      <div><div class="print-title">金銭出納帳</div><div id="printClient" class="print-meta"></div></div>
      <div id="printMonth" class="print-meta"></div>
    </div>
    <div class="print-summary">
      <span>入金 <b id="printIncome">¥0</b></span>
      <span>支出 <b id="printExpense">¥0</b></span>
      <span>残高 <b id="printBalance">¥0</b></span>
    </div>
    <table class="print-table">
      <colgroup><col style="width:12%"><col style="width:19%"><col style="width:22%"><col style="width:11%"><col style="width:11%"><col style="width:12%"><col style="width:13%"></colgroup>
      <thead><tr><th>日付</th><th>店名</th><th>品名</th><th>入金</th><th>支出</th><th>残高</th><th>備考</th></tr></thead>
      <tbody id="printBody"></tbody>
    </table>
  </section>

  <section class="card history-card">
    <div class="section-title">📖 入力履歴</div>
    <div class="toolbar">
      <div class="field"><label>月</label><input id="monthFilter" type="month" onchange="render()"></div>
      <div class="field"><label>検索</label><input id="searchInput" type="search" placeholder="品名・店名・備考" oninput="renderHistory()"></div>
      <button class="btn green" onclick="exportCsv()">Excel用CSV</button>
    </div>
    <div id="history" class="history"></div>
  </section>
</main>

<div id="pickerOverlay" class="overlay hidden">
 <div class="sheet">
  <div class="row-between"><div><h2 id="pickerTitle" style="margin:0;font-size:19px">店名を選択</h2><div class="small">タップすると選択されます。</div></div><button class="btn" onclick="closePicker()">×</button></div>
  <input id="pickerSearch" class="picker-search" type="search" inputmode="search" placeholder="検索" oninput="renderPickerList()">
  <div id="pickerList" class="picker-list"></div>
  <button id="pickerAddBtn" class="picker-add" onclick="addFromPicker()">＋ 新しい店名を追加</button>
 </div>
</div>

<div id="choiceOverlay" class="overlay hidden">
 <div class="sheet">
  <div class="row-between"><div><h2 id="choiceTitle" style="margin:0">品名を追加</h2><div class="small">登録すると、すべての利用者で候補として使えます。</div></div><button class="btn" onclick="closeChoiceAdd()">×</button></div>
  <div class="field"><label id="choiceLabel">品名</label><input id="newChoiceInput" maxlength="120" placeholder="例：昼食"></div>
  <button id="choiceSaveBtn" class="save" onclick="saveChoiceMaster()">全利用者に追加する</button>
  <div id="choiceStatus" class="status"></div>
 </div>
</div>

<div id="editOverlay" class="overlay hidden">
 <div class="sheet">
  <div class="row-between"><h2 style="margin:0">記録を修正</h2><button class="btn" onclick="closeEdit()">×</button></div>
  <div class="field"><label>日付</label><input id="editDate" type="date"></div>
  <div class="segment"><button id="editExpenseBtn" class="seg expense active" onclick="setEditKind('expense')">－ 支出</button><button id="editIncomeBtn" class="seg income" onclick="setEditKind('income')">＋ 入金</button></div>
  <div class="field"><label>金額</label><input id="editAmount" class="amount-input" type="number" inputmode="numeric" min="1"></div>
  <div class="field"><label>品名・内容</label><input id="editItem" maxlength="120"></div>
  <div class="field"><label>店名・支払先</label><input id="editStore" maxlength="120"></div>
  <div class="field"><label>備考</label><textarea id="editMemo" maxlength="300"></textarea></div>
  <button class="save" onclick="saveEdit()">修正して保存</button>
  <div id="editStatus" class="status"></div>
 </div>
</div>

<script>
const SUPABASE_URL="https://pagamoaxhqszojxrpxyu.supabase.co";
const SUPABASE_KEY="sb_publishable_GQFRQYCo2oACYAh9lj9ZyA_JqfIPJGT";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null,membership=null,organization=null,clients=[],selectedClientId=null,entries=[],account=null,choices=[],kind="expense",editKind="expense",editingId=null,choiceAddKind="item",pickerKind="store";

function show(id){document.getElementById(id).classList.remove("hidden")}
function hide(id){document.getElementById(id).classList.add("hidden")}
function localDate(d=new Date()){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function currentMonth(){return localDate().slice(0,7)}
function yen(n){return new Intl.NumberFormat("ja-JP",{style:"currency",currency:"JPY",maximumFractionDigits:0}).format(Number(n)||0)}
function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function clientLabel(c){return c.code+(c.display_name?" "+c.display_name:"")}
function net(e){return e.kind==="income"?Number(e.amount):-Number(e.amount)}

async function init(){
 const {data:{session:s}}=await db.auth.getSession(); session=s;
 if(!session){show("auth");return}
 hide("auth"); show("app");
 const {data:m,error}=await db.from("organization_members").select("organization_id,role,staff_name").eq("user_id",session.user.id).limit(1).maybeSingle();
 if(error||!m){alert(error?.message||"事業所への参加が必要です。");return}
 membership=m;
 const [{data:o},{data:cs}] = await Promise.all([
   db.from("organizations").select("id,name").eq("id",m.organization_id).single(),
   db.from("clients").select("id,code,display_name,sort_order").eq("organization_id",m.organization_id).order("sort_order").order("code")
 ]);
 organization=o;clients=cs||[];
 document.getElementById("orgLabel").textContent=(o?.name||"事業所")+" / "+(m.staff_name||session.user.email||"職員");
 document.getElementById("clientSelect").innerHTML=clients.map(c=>'<option value="'+c.id+'">'+esc(clientLabel(c))+'</option>').join("");
 document.getElementById("txDate").value=localDate();
 document.getElementById("monthFilter").value=currentMonth();
 if(m.role==="admin")show("adminCard");
 if(clients.length){selectedClientId=clients[0].id;await reloadAll()}
 else document.getElementById("history").innerHTML='<div class="empty">利用者が登録されていません。</div>';
}
async function login(){
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 const {error}=await db.auth.signInWithPassword({email,password});
 document.getElementById("authMsg").textContent=error?error.message:"";
 if(!error)location.reload();
}
async function signup(){
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 const {error}=await db.auth.signUp({email,password});
 document.getElementById("authMsg").textContent=error?error.message:"登録しました。事業所参加後に利用できます。";
 if(!error)setTimeout(()=>location.reload(),500);
}
async function logout(){await db.auth.signOut();location.reload()}
async function changeClient(id){selectedClientId=id;await reloadAll()}

async function reloadAll(){
 if(!selectedClientId)return;
 const [{data:a,error:ae},{data:es,error:ee},{data:ch,error:ce}]=await Promise.all([
   db.from("cashbook_accounts").select("*").eq("organization_id",membership.organization_id).eq("client_id",selectedClientId).maybeSingle(),
   db.from("cashbook_entries").select("*").eq("organization_id",membership.organization_id).eq("client_id",selectedClientId).order("tx_date",{ascending:true}).order("created_at",{ascending:true}).limit(2000),
   db.from("cashbook_choices").select("*").eq("organization_id",membership.organization_id).order("sort_order").order("created_at",{ascending:false})
 ]);
 if(ae||ee||ce){alert((ae||ee||ce).message);return}
 account=a||{opening_balance:0};entries=es||[];choices=ch||[];
 document.getElementById("openingBalance").value=Number(account.opening_balance)||0;
 renderChoices();render();
}
function renderChoices(){
 if(!document.getElementById("pickerOverlay").classList.contains("hidden")) renderPickerList();
}
function openPicker(v){
 pickerKind=v;
 const isItem=v==="item";
 document.getElementById("pickerTitle").textContent=isItem?"品名を選択":"店名を選択";
 document.getElementById("pickerAddBtn").textContent=isItem?"＋ 新しい品名を追加":"＋ 新しい店名を追加";
 document.getElementById("pickerSearch").value="";
 show("pickerOverlay");
 renderPickerList();
 setTimeout(()=>document.getElementById("pickerSearch").focus(),100);
}
function closePicker(){hide("pickerOverlay")}
function renderPickerList(){
 const q=(document.getElementById("pickerSearch").value||"").trim().toLowerCase();
 const list=choices.filter(x=>x.kind===pickerKind).filter(x=>!q||x.label.toLowerCase().includes(q));
 const box=document.getElementById("pickerList");
 if(!list.length){box.innerHTML='<div class="picker-empty">候補がありません。下の「＋追加」から登録できます。</div>';return}
 box.innerHTML=list.map(x=>'<button class="picker-choice" type="button" onclick="selectChoice(\''+pickerKind+'\',\''+encodeURIComponent(x.label)+'\')">'+esc(x.label)+'</button>').join("");
}
function selectChoice(type,v){
 const label=decodeURIComponent(v);
 document.getElementById(type).value=label;
 const text=document.getElementById(type+"PickerText"),btn=document.getElementById(type+"PickerBtn");
 text.textContent=label;text.classList.remove("placeholder");btn.classList.add("selected");
 closePicker();
}
function clearPickerValue(type){
 document.getElementById(type).value="";
 const text=document.getElementById(type+"PickerText"),btn=document.getElementById(type+"PickerBtn");
 text.textContent=type==="store"?"タップして店名を選択":"タップして品名を選択";
 text.classList.add("placeholder");btn.classList.remove("selected");
}
function addFromPicker(){closePicker();openChoiceAdd(pickerKind)}

async function reloadChoices(){
 const {data,error}=await db.from("cashbook_choices").select("*").eq("organization_id",membership.organization_id).order("sort_order").order("created_at",{ascending:false});
 if(error){document.getElementById("choiceStatus").textContent="読み込めませんでした: "+error.message;return}
 choices=data||[];renderChoices();
}
function openChoiceAdd(v){
 choiceAddKind=v;
 const isItem=v==="item";
 document.getElementById("choiceTitle").textContent=isItem?"品名を追加":"店名を追加";
 document.getElementById("choiceLabel").textContent=isItem?"品名・内容":"店名・支払先";
 document.getElementById("newChoiceInput").placeholder=isItem?"例：昼食、日用品、散髪":"例：スーパー、薬局、コンビニ";
 document.getElementById("newChoiceInput").value="";
 document.getElementById("choiceStatus").textContent="";
 show("choiceOverlay");
 setTimeout(()=>document.getElementById("newChoiceInput").focus(),100);
}
function closeChoiceAdd(){hide("choiceOverlay")}
async function saveChoiceMaster(){
 const input=document.getElementById("newChoiceInput"),label=input.value.trim(),st=document.getElementById("choiceStatus"),btn=document.getElementById("choiceSaveBtn");
 if(!label){st.textContent=(choiceAddKind==="item"?"品名":"店名")+"を入力してください。";return}
 if(choices.some(x=>x.kind===choiceAddKind&&x.label===label)){st.textContent="すでに登録されています。";return}
 btn.disabled=true;st.textContent="追加中…";
 const {error}=await db.from("cashbook_choices").insert({organization_id:membership.organization_id,kind:choiceAddKind,label,sort_order:0,created_by:session.user.id});
 btn.disabled=false;
 if(error){st.textContent=error.code==="23505"?"すでに登録されています。":"追加できませんでした: "+error.message;return}
 await reloadChoices();
 selectChoice(choiceAddKind,encodeURIComponent(label));
 hide("pickerOverlay");
 st.textContent="全利用者で使えるように追加しました。";
 setTimeout(closeChoiceAdd,650);
}
function fillChoice(type,v){selectChoice(type,v)}
function setKind(v){
 kind=v;
 document.getElementById("expenseBtn").classList.toggle("active",v==="expense");
 document.getElementById("incomeBtn").classList.toggle("active",v==="income");
}
async function rememberChoice(choiceKind,label){
 const v=label.trim();if(!v)return;
 if(choices.some(x=>x.kind===choiceKind&&x.label===v))return;
 const {error}=await db.from("cashbook_choices").insert({organization_id:membership.organization_id,kind:choiceKind,label:v,sort_order:0,created_by:session.user.id});
 if(error&&error.code!=="23505")console.error(error);
}
async function saveEntry(){
 const amount=Number(document.getElementById("amount").value),txDate=document.getElementById("txDate").value,item=document.getElementById("item").value.trim(),store=document.getElementById("store").value.trim(),memo=document.getElementById("memo").value.trim(),st=document.getElementById("saveStatus");
 if(!selectedClientId){st.textContent="利用者を選択してください。";return}
 if(!txDate){st.textContent="日付を入力してください。";return}
 if(!Number.isInteger(amount)||amount<=0){st.textContent="金額を1円以上で入力してください。";return}
 if(!store){st.textContent="店名・支払先を選択してください。";return}
 if(!item){st.textContent="品名・内容を選択してください。";return}
 document.getElementById("saveBtn").disabled=true;st.textContent="保存中…";
 const {error}=await db.from("cashbook_entries").insert({organization_id:membership.organization_id,client_id:selectedClientId,tx_date:txDate,kind,amount,item,store,memo,created_by:session.user.id,updated_by:session.user.id});
 document.getElementById("saveBtn").disabled=false;
 if(error){st.textContent="保存できませんでした: "+error.message;return}
 await Promise.all([rememberChoice("item",item),rememberChoice("store",store)]);
 document.getElementById("amount").value="";clearPickerValue("item");clearPickerValue("store");document.getElementById("memo").value="";
 st.textContent="保存しました。";await reloadAll();
}
function ledgerRows(){
 let bal=Number(account?.opening_balance)||0;
 return entries.map(e=>{bal+=net(e);return {...e,balance:bal}});
}
function render(){
 const rows=ledgerRows(),month=document.getElementById("monthFilter").value||currentMonth();
 const mrows=rows.filter(x=>x.tx_date.startsWith(month));
 const income=mrows.filter(x=>x.kind==="income").reduce((a,x)=>a+Number(x.amount),0);
 const expense=mrows.filter(x=>x.kind==="expense").reduce((a,x)=>a+Number(x.amount),0);
 const current=rows.length?rows[rows.length-1].balance:Number(account?.opening_balance)||0;
 document.getElementById("currentBalance").textContent=yen(current);
 document.getElementById("monthIncome").textContent=yen(income);
 document.getElementById("monthExpense").textContent=yen(expense);
 renderHistory();
 renderPrintReport();
}

function printRows(){
 const month=document.getElementById("monthFilter").value||currentMonth(),q=document.getElementById("searchInput").value.trim().toLowerCase();
 return ledgerRows().filter(x=>x.tx_date.startsWith(month)).filter(x=>!q||[x.item,x.store,x.memo].some(v=>(v||"").toLowerCase().includes(q)));
}
function renderPrintReport(){
 const month=document.getElementById("monthFilter").value||currentMonth(),rows=printRows(),client=clients.find(x=>x.id===selectedClientId);
 const income=rows.filter(x=>x.kind==="income").reduce((a,x)=>a+Number(x.amount),0);
 const expense=rows.filter(x=>x.kind==="expense").reduce((a,x)=>a+Number(x.amount),0);
 const allRows=ledgerRows(),balance=allRows.length?allRows[allRows.length-1].balance:Number(account?.opening_balance)||0;
 document.getElementById("printClient").textContent=client?clientLabel(client):"";
 document.getElementById("printMonth").textContent=month.replace("-","年")+"月";
 document.getElementById("printIncome").textContent=yen(income);
 document.getElementById("printExpense").textContent=yen(expense);
 document.getElementById("printBalance").textContent=yen(balance);
 const body=document.getElementById("printBody");
 if(!rows.length){body.innerHTML='<tr><td colspan="7" style="text-align:center;padding:8px">記録なし</td></tr>';return}
 body.innerHTML=rows.map(e=>'<tr>'+
   '<td class="date">'+esc(e.tx_date.slice(5).replace("-","/"))+'</td>'+
   '<td>'+esc(e.store||"")+'</td>'+
   '<td>'+esc(e.item||"")+'</td>'+
   '<td class="num">'+(e.kind==="income"?yen(e.amount):"")+'</td>'+
   '<td class="num">'+(e.kind==="expense"?yen(e.amount):"")+'</td>'+
   '<td class="num">'+yen(e.balance)+'</td>'+
   '<td>'+esc(e.memo||"")+'</td>'+
   '</tr>').join("");
}
function printCashbook(){renderPrintReport();window.print()}

function renderHistory(){
 const month=document.getElementById("monthFilter").value||currentMonth(),q=document.getElementById("searchInput").value.trim().toLowerCase();
 const rows=ledgerRows().filter(x=>x.tx_date.startsWith(month)).filter(x=>!q||[x.item,x.store,x.memo].some(v=>(v||"").toLowerCase().includes(q))).reverse();
 const box=document.getElementById("history");
 if(!rows.length){box.innerHTML='<div class="empty">この月の記録はありません。</div>';return}
 box.innerHTML=rows.map(e=>{
   const canEdit=e.created_by===session.user.id||membership.role==="admin";
   return '<div class="entry"><div class="entry-head"><div><div class="entry-date">'+esc(e.tx_date)+'</div><div class="entry-title">'+esc(e.item||"(内容なし)")+'</div><div class="entry-sub">'+(e.store?'🏪 '+esc(e.store):'')+(e.memo?'　'+esc(e.memo):'')+'</div></div><div class="entry-money"><div class="amt '+(e.kind==="income"?"in":"out")+'">'+(e.kind==="income"?"+ ":"- ")+yen(e.amount)+'</div><div class="bal">残高 '+yen(e.balance)+'</div></div></div>'+(canEdit?'<div class="entry-actions"><button class="mini" onclick="openEdit(\''+e.id+'\')">修正</button><button class="mini" onclick="deleteEntry(\''+e.id+'\')">削除</button></div>':'')+'</div>';
 }).join("");
}
async function saveOpeningBalance(){
 if(membership.role!=="admin")return;
 const v=Number(document.getElementById("openingBalance").value),st=document.getElementById("adminStatus");
 if(!Number.isInteger(v)||v<0){st.textContent="開始残高は0円以上で入力してください。";return}
 const payload={organization_id:membership.organization_id,client_id:selectedClientId,opening_balance:v,updated_by:session.user.id,updated_at:new Date().toISOString()};
 const {error}=await db.from("cashbook_accounts").upsert(payload,{onConflict:"organization_id,client_id"});
 st.textContent=error?"保存できませんでした: "+error.message:"開始残高を保存しました。";
 if(!error)await reloadAll();
}
function openEdit(id){
 const e=entries.find(x=>x.id===id);if(!e)return;editingId=id;editKind=e.kind;
 document.getElementById("editDate").value=e.tx_date;document.getElementById("editAmount").value=e.amount;document.getElementById("editItem").value=e.item;document.getElementById("editStore").value=e.store;document.getElementById("editMemo").value=e.memo||"";document.getElementById("editStatus").textContent="";setEditKind(e.kind);show("editOverlay");
}
function closeEdit(){hide("editOverlay");editingId=null}
function setEditKind(v){editKind=v;document.getElementById("editExpenseBtn").classList.toggle("active",v==="expense");document.getElementById("editIncomeBtn").classList.toggle("active",v==="income")}
async function saveEdit(){
 if(!editingId)return;
 const amount=Number(document.getElementById("editAmount").value),tx_date=document.getElementById("editDate").value,item=document.getElementById("editItem").value.trim(),store=document.getElementById("editStore").value.trim(),memo=document.getElementById("editMemo").value.trim(),st=document.getElementById("editStatus");
 if(!tx_date||!item||!Number.isInteger(amount)||amount<=0){st.textContent="日付・金額・品名を確認してください。";return}
 const {error}=await db.from("cashbook_entries").update({tx_date,kind:editKind,amount,item,store,memo,updated_by:session.user.id,updated_at:new Date().toISOString()}).eq("id",editingId).eq("organization_id",membership.organization_id);
 if(error){st.textContent="修正できませんでした: "+error.message;return}
 await Promise.all([rememberChoice("item",item),rememberChoice("store",store)]);closeEdit();await reloadAll();
}
async function deleteEntry(id){
 if(!confirm("この記録を削除しますか？"))return;
 const {error}=await db.from("cashbook_entries").delete().eq("id",id).eq("organization_id",membership.organization_id);
 if(error){alert("削除できませんでした: "+error.message);return}await reloadAll();
}
function exportCsv(){
 const month=document.getElementById("monthFilter").value||currentMonth(),c=clients.find(x=>x.id===selectedClientId),rows=ledgerRows().filter(x=>x.tx_date.startsWith(month));
 const lines=[["利用者","日付","区分","品名・内容","店名・支払先","入金","支出","残高","備考"],...rows.map(e=>[clientLabel(c||{code:""}),e.tx_date,e.kind==="income"?"入金":"支出",e.item,e.store,e.kind==="income"?e.amount:"",e.kind==="expense"?e.amount:"",e.balance,e.memo])];
 const csv="\uFEFF"+lines.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=(c?clientLabel(c).replace(/[\\/:*?"<>|]/g,"_"):"出納帳")+"_"+month+".csv";a.click();URL.revokeObjectURL(url);
}
db.auth.onAuthStateChange((event,s)=>{if(event==="SIGNED_OUT"){session=null;show("auth");hide("app")}else if(s&&!session){session=s}});
init();
</script>
</body>
