<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ログイン | 食事管理</title><link rel="stylesheet" href="style.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script defer src="config.js"></script><script defer src="connection.js"></script><script defer src="login.js"></script></head><body><main style="max-width:520px"><div class="eyebrow" data-company>食事管理</div><h1>職員ログイン</h1><section class="panel"><p>登録済みのメールアドレスとパスワードでログインしてください。</p><form id="loginForm"><label>メールアドレス<input name="email" type="email" autocomplete="username" required></label><label>パスワード<input name="password" type="password" autocomplete="current-password" required></label><p id="loginStatus" role="status"></p><button type="submit" class="primary">ログイン</button></form><p class="muted">パスワードが分からない場合は管理者にお問い合わせください。</p></section><section class="panel"><h2>初めての方：職員登録</h2><p>登録だけでは利用者情報は表示されません。登録後、管理者に施設への追加を依頼してください。</p><form id="signupForm"><label>メールアドレス<input name="email" type="email" autocomplete="username" required></label><label>パスワード（12文字以上）<input name="password" type="password" minlength="12" autocomplete="new-password" required></label><label>パスワードの確認<input name="confirm" type="password" minlength="12" autocomplete="new-password" required></label><p id="signupStatus" role="status"></p><button type="submit">職員登録</button></form></section><a href="manage.html">初期管理者の施設設定</a></main></body></html>
