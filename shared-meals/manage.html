<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>施設・職員管理 | 食事管理</title><link rel="stylesheet" href="style.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script defer src="config.js"></script><script defer src="connection.js"></script><script defer src="manage.js"></script></head><body><header><div class="brand" data-company>食事管理</div><nav class="app-nav"><a href="index.html">食事管理に戻る</a><a href="login.html">ログイン</a><button id="signout">ログアウト</button></nav></header><main><h1>施設・職員管理</h1><p id="status" role="status">接続を確認中…</p><div id="content" hidden><section id="newOffice" class="panel" hidden><h2>施設を追加</h2><form id="officeForm" class="row"><label>施設名<input name="name" required maxlength="120"></label><label>管理者の表示名<input name="staff" required maxlength="80"></label><button class="primary">施設を作成</button></form></section><section class="panel"><label>施設<select id="offices"></select></label><p id="role"></p></section><section id="admin" hidden class="panel"><h2>職員を追加</h2><p>職員に同じURLを共有し、ログイン画面で職員登録してもらってください。その後、本人のメールアドレスを確認してこの施設に追加します。</p><form id="memberForm"><div class="formgrid"><label>メールアドレス<input type="email" name="email" required></label><label>職員名<input name="staff" required maxlength="80"></label><label>権限<select name="role"><option value="staff">職員（提供チェック）</option><option value="admin">管理者（設定・職員管理）</option></select></label></div><button>確認して追加・更新</button></form></section><section class="panel"><h2>この施設の職員</h2><div id="members"></div></section><section class="panel"><h2>利用者管理</h2><p>新しい利用者は「食事管理 → 利用者・料金設定」で登録してください。退去した人の履歴は保持します。</p><div id="residents"></div></section></div></main></body></html>
