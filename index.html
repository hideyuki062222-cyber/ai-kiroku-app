<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>障害福祉 AI記録作成</title>
<style>
body{margin:0;background:#f5f7fb;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}
.loading{max-width:560px;margin:70px auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.loading h1{font-size:20px;margin:0 0 8px}.loading p{font-size:13px;color:#667085;line-height:1.7}
</style>
</head>
<body>
<div class="loading" id="loader"><h1>AI記録作成</h1><p id="loadMsg">担当割当とAI記録を読み込んでいます…</p></div>
<script>
(async()=>{
  const sources=[
    "https://raw.githubusercontent.com/hideyuki062222-cyber/ai-kiroku-app/a8fa212e05b08867c5a426d13f05baa8847e4165/index.html",
    "https://cdn.jsdelivr.net/gh/hideyuki062222-cyber/ai-kiroku-app@a8fa212e05b08867c5a426d13f05baa8847e4165/index.html"
  ];
  let h="",lastError=null;
  for(const url of sources){
    try{
      const r=await fetch(url,{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      h=await r.text();
      if(h.includes("障害福祉 AI記録作成")) break;
    }catch(e){lastError=e;}
  }
  if(!h){
    document.getElementById("loadMsg").textContent="画面を読み込めませんでした。再読み込みしてください。 "+(lastError?.message||"");
    return;
  }

  h=h.replace(
    ".app-nav{display:grid;grid-template-columns:repeat(3,1fr);",
    ".app-nav{display:grid;grid-template-columns:repeat(4,1fr);"
  );
  h=h.replace(
`    <nav class="app-nav" aria-label="アプリ切替">
      <a class="app-tab" href="./handoff/">申し送り</a>
      <a class="app-tab active" href="./">AI記録</a>
      <a class="app-tab" href="./cashbook/">出納帳</a>
    </nav>`,
`    <nav class="app-nav" aria-label="アプリ切替">
      <a class="app-tab" href="./assignment/">担当割当</a>
      <a class="app-tab" href="./handoff/">申し送り</a>
      <a class="app-tab active" href="./">AI記録</a>
      <a class="app-tab" href="./cashbook/">出納帳</a>
    </nav>`
  );

  h=h.replace("</style>",`
  @media(max-width:650px){.app-nav{grid-template-columns:repeat(2,1fr)!important}}
  .security-readonly{opacity:.82}
  .security-readonly input:disabled,.security-readonly textarea:disabled{background:#f8fafc;color:#475467}
</style>`);

  h=h.replace(
'  <section class="card">\n    <label>利用者登録・変更</label>',
'  <section class="card" id="clientAdminCard">\n    <label>利用者登録・変更</label>'
  );
  h=h.replace(
'  <section class="card">\n    <label>利用者プロフィール</label>',
'  <section class="card" id="profileAdminCard">\n    <label>利用者プロフィール</label>'
  );
  h=h.replace('placeholder="8文字以上を推奨"','placeholder="12文字以上を推奨"');
  h=h.replace('password.length < 8','password.length < 12');
  h=h.replace('メールアドレスと8文字以上のパスワードを入力してください。','メールアドレスと12文字以上のパスワードを入力してください。');

  const card=`
  <section class="card hidden" id="assignmentContextCard">
    <label>担当割当から引き継ぎ</label>
    <div class="notice" id="assignmentContextText"></div>
    <div class="actions">
      <button class="secondary" onclick="location.href='./assignment/'">担当割当へ戻る</button>
    </div>
  </section>
`;
  if(!h.includes('id="assignmentContextCard"')){
    h=h.replace(
      `  </section>

  <section class="card" id="myStaffCard">`,
      `  </section>
${card}
  <section class="card" id="myStaffCard">`
    );
  }

  const helper=`
function applySecurityRoleUi(role){
  const isAdmin=role==="admin";
  const clientCard=document.getElementById("clientAdminCard");
  if(clientCard) clientCard.classList.toggle("hidden",!isAdmin);
  const profileCard=document.getElementById("profileAdminCard");
  if(profileCard){
    profileCard.classList.toggle("security-readonly",!isAdmin);
    profileCard.querySelectorAll("input,textarea").forEach(el=>{el.disabled=!isAdmin;});
    profileCard.querySelectorAll("button").forEach(el=>{el.classList.toggle("hidden",!isAdmin);});
    let note=profileCard.querySelector(".security-role-note");
    if(!note){
      note=document.createElement("div");note.className="notice security-role-note";
      const firstNotice=profileCard.querySelector(".notice");
      if(firstNotice) firstNotice.after(note); else profileCard.prepend(note);
    }
    note.textContent=isAdmin?"管理者としてプロフィールを編集できます。":"一般職員はプロフィールを閲覧のみできます。変更は管理者が行います。";
  }
}

function applyAssignmentContext(){
  const q=new URLSearchParams(location.search);
  if(q.get("from")!=="assignment") return;
  const ctx={
    assignmentId:q.get("assignment")||"",
    client:q.get("client")||"",
    date:q.get("date")||"",
    time:q.get("time")||"",
    staff:q.get("staff")||"",
    memo:q.get("memo")||"",
    label:q.get("label")||""
  };
  window.assignmentContext=ctx;
  const card=document.getElementById("assignmentContextCard");
  const text=document.getElementById("assignmentContextText");
  if(card) card.classList.remove("hidden");
  if(text) text.textContent=(ctx.date||"")+" "+(ctx.time||"")+" / "+(ctx.client||"")+" / 担当："+(ctx.staff||"未設定")+(ctx.memo?" / メモ："+ctx.memo:"");
  const userSel=document.getElementById("user");
  const profileSel=document.getElementById("profileUser");
  if(ctx.client && users.includes(ctx.client)){
    if(userSel) userSel.value=ctx.client;
    if(profileSel){profileSel.value=ctx.client;loadProfile();}
  }
  const inputEl=document.getElementById("input");
  if(inputEl && ctx.memo && !inputEl.value.trim()){
    inputEl.value=ctx.memo;
    const count=document.getElementById("inputCount");
    if(count) count.textContent=inputEl.value.length+"文字";
  }
  const label=ctx.label||"";
  const map=[
    ["起床","起床介助"],["就寝","就寝介助"],["排泄","トイレ介助"],["トイレ","トイレ介助"],
    ["食介","食事介助"],["食事","食事介助"],["入浴","入浴介助"],["更衣","更衣介助"],
    ["服薬","服薬介助・確認"],["口腔","口腔ケア"],["家事","家事援助"],["通院","通院等介助"]
  ];
  for(const pair of map){
    if(label.includes(pair[0])){
      const cb=[...document.querySelectorAll('input[name="serviceContent"]')].find(x=>x.value===pair[1]);
      if(cb) cb.checked=true;
    }
  }
}
`;
  if(!h.includes("function applyAssignmentContext()")){
    const marker="refreshUserSelect();"+String.fromCharCode(10)+"</scr"+"ipt>";
    const replacement=helper+String.fromCharCode(10)+"refreshUserSelect();"+String.fromCharCode(10)+"</scr"+"ipt>";
    h=h.replace(marker,replacement);
  }

  h=h.replace(
`    refreshUserSelect();
  }

  async function loadCloudHistory(){`,
`    refreshUserSelect();
    applyAssignmentContext();
  }

  async function loadCloudHistory(){`
  );

  h=h.replace(
`    hide(overlay());
    hide(staffAdminCard());
    loadMyStaffName();`,
`    hide(overlay());
    hide(staffAdminCard());
    if(window.applySecurityRoleUi) window.applySecurityRoleUi(membership.role);
    loadMyStaffName();`
  );

  h=h.replace(
`      support_method_snapshot:record.supportMethodSnapshot || "",
      visit_note:record.visitNote || "",
      care_note:record.careNote || ""
    };`,
`      support_method_snapshot:record.supportMethodSnapshot || "",
      visit_note:record.visitNote || "",
      care_note:record.careNote || "",
      service_date:window.assignmentContext?.date || null,
      service_time:window.assignmentContext?.time || null,
      assignment_id:window.assignmentContext?.assignmentId || null
    };`
  );

  h=h.replace(
`    const { error } = await client.from("care_records").insert(payload);
    if(error) throw error;
    await loadCloudHistory();`,
`    const { error } = await client.from("care_records").insert(payload);
    if(error) throw error;
    if(window.assignmentContext){
      const text=document.getElementById("assignmentContextText");
      if(text && !text.textContent.includes("記録保存済み")) text.textContent += " / ✓ 記録保存済み";
    }
    await loadCloudHistory();`
  );

  document.open();
  document.write(h);
  document.close();
})();
</script>
</body>
</html>
