<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>申し送り | COZY支援システム</title>
<style>body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.loading{max-width:560px;margin:70px auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0002}.loading h1{font-size:20px;margin:0 0 8px}.loading p{font-size:13px;color:#677489;line-height:1.7}</style>
</head>
<body>
<div class="loading"><h1>申し送り</h1><p id="loadMsg">最新の申し送り画面を読み込んでいます…</p></div>
<script>
(async()=>{
 const sources=[
  'https://raw.githubusercontent.com/hideyuki062222-cyber/ai-kiroku-app/91b47bf1827139706f49f970a1ec6c5126d46134/handoff/index.html',
  'https://cdn.jsdelivr.net/gh/hideyuki062222-cyber/ai-kiroku-app@91b47bf1827139706f49f970a1ec6c5126d46134/handoff/index.html'
 ];
 let h='',lastError=null;
 for(const url of sources){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);h=await r.text();if(h.includes('デジタル申し送り'))break;}catch(e){lastError=e}}
 if(!h){document.getElementById('loadMsg').textContent='画面を読み込めませんでした。再読み込みしてください。 '+(lastError?.message||'');return}

 // 共通メニューを元HTMLの段階で直接差し替える。common-nav.jsが失敗しても担当割当へ移動できる。
 h=h.replace(/<nav class="app-nav" aria-label="アプリ切替">[\s\S]*?<\/nav>/,
 `<nav class="app-nav" aria-label="メインメニュー">
        <a class="app-tab" href="../dashboard/">今日</a>
        <a class="app-tab" href="../assignment/">担当割当</a>
        <a class="app-tab active" href="./" aria-current="page">申し送り</a>
        <a class="app-tab" href="../">AI記録</a>
        <a class="app-tab" href="../cashbook/">出納帳</a>
      </nav>`);

 // 他画面と同じ白・グレー基調の共通デザインを後勝ちで適用。
 h=h.replace('</head>','<link rel="stylesheet" href="./unified-theme.css?v=20261007-1"></head>');
 // 共通ナビは二重の安全策。直接差し替え済みなので、読み込めなくても主要リンクは残る。
 h=h.replace('</body>','<script src="../common-nav.js?v=20261007-2"><\/script></body>');
 document.open();document.write(h);document.close();
})();
</script>
</body>
</html>
