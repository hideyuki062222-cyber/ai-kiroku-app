<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16345b">
<title>デジタル申し送り | COZY蒲生</title>
<style>body{margin:0;background:#f4f6f9;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.loading{max-width:560px;margin:70px auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0002}.loading h1{font-size:20px;margin:0 0 8px}.loading p{font-size:13px;color:#677489;line-height:1.7}</style>
</head>
<body>
<div class="loading"><h1>申し送り</h1><p id="loadMsg">担当割当・AI記録・出納帳との共通メニューを読み込んでいます…</p></div>
<script>
(async()=>{
 const sources=[
  'https://raw.githubusercontent.com/hideyuki062222-cyber/ai-kiroku-app/91b47bf1827139706f49f970a1ec6c5126d46134/handoff/index.html',
  'https://cdn.jsdelivr.net/gh/hideyuki062222-cyber/ai-kiroku-app@91b47bf1827139706f49f970a1ec6c5126d46134/handoff/index.html'
 ];
 let h='',lastError=null;
 for(const url of sources){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);h=await r.text();if(h.includes('デジタル申し送り'))break;}catch(e){lastError=e}}
 if(!h){document.getElementById('loadMsg').textContent='画面を読み込めませんでした。再読み込みしてください。 '+(lastError?.message||'');return}
 h=h.replace('grid-template-columns:repeat(3,auto)','grid-template-columns:repeat(4,auto)');
 h=h.replace('.app-nav{grid-template-columns:repeat(3,1fr);width:100%}', '.app-nav{grid-template-columns:repeat(2,1fr);width:100%}');
 h=h.replace(
 `<nav class="app-nav" aria-label="アプリ切替">\n      <a class="app-tab active" href="./">申し送り</a>\n      <a class="app-tab" href="../">AI記録</a>\n      <a class="app-tab" href="../cashbook/">出納帳</a>\n    </nav>`,
 `<nav class="app-nav" aria-label="アプリ切替">\n      <a class="app-tab" href="../assignment/">担当割当</a>\n      <a class="app-tab active" href="./">申し送り</a>\n      <a class="app-tab" href="../">AI記録</a>\n      <a class="app-tab" href="../cashbook/">出納帳</a>\n    </nav>`
 );
 document.open();document.write(h);document.close();
})();
</script>
</body>
</html>
