<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>申し送り | COZY支援システム</title>
<style>body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}.loading{max-width:560px;margin:70px auto;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;box-shadow:0 2px 10px #00000008}.loading h1{font-size:20px;margin:0 0 8px}.loading p{font-size:13px;color:#667085;line-height:1.7}</style>
</head>
<body>
<div class="loading"><h1>申し送り</h1><p id="loadMsg">申し送り画面を読み込んでいます…</p></div>
<script>
(async()=>{
 const sources=[
  'https://raw.githubusercontent.com/hideyuki062222-cyber/ai-kiroku-app/91b47bf1827139706f49f970a1ec6c5126d46134/handoff/index.html',
  'https://cdn.jsdelivr.net/gh/hideyuki062222-cyber/ai-kiroku-app@91b47bf1827139706f49f970a1ec6c5126d46134/handoff/index.html'
 ];
 let h='',lastError=null;
 for(const url of sources){
   try{
     const r=await fetch(url,{cache:'no-store'});
     if(!r.ok)throw new Error('HTTP '+r.status);
     h=await r.text();
     if(h.includes('デジタル申し送り'))break;
   }catch(e){lastError=e}
 }
 if(!h){
   document.getElementById('loadMsg').textContent='画面を読み込めませんでした。再読み込みしてください。 '+(lastError?.message||'');
   return;
 }
 h=h.replace('password.length<6','password.length<12');
 h=h.replace('メールアドレスと6文字以上のパスワードを入力してください。','メールアドレスと12文字以上のパスワードを入力してください。');
 const addon='<script src="../client-room-ui.js?v=20261014-1"><\/script><script src="./safety-addon.js?v=20261014-4"><\/script><script src="../common-nav.js?v=20261028-ui"><\/script>';
 const bodyClose=h.lastIndexOf('</body>');
 if(bodyClose>=0) h=h.slice(0,bodyClose)+addon+h.slice(bodyClose);
 else h+=addon;
 document.open();document.write(h);document.close();
})();
</script>
</body>
</html>
