<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BROOK本部 求人管理（接続準備版）</title><style>body{font:16px system-ui,sans-serif;background:#f5f7fb;color:#182230;margin:0}main{max-width:850px;margin:30px auto;padding:16px}.panel{background:#fff;border:1px solid #d0d5dd;border-radius:14px;padding:20px;margin:12px 0}.warning{background:#fffaeb;padding:12px;border-radius:10px}label{display:block;margin:12px 0 5px;font-weight:600}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #98a2b3;border-radius:8px;font:inherit}textarea{min-height:100px}button{padding:11px 15px;border:0;border-radius:8px;background:#175cd3;color:white;margin:10px 5px 0 0;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none}.item{border-top:1px solid #eee;padding:12px 0}.muted{color:#667085;font-size:14px}@media(max-width:600px){main{margin:0;padding:10px}.panel{padding:14px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script></head><body><main><h1>BROOK本部｜求人編集</h1><p class="warning">開発ブランチの接続準備版です。採用テーブル未適用のため、現在は保存できません。既存AI記録管理者には採用権限を自動付与しません。</p>
<section id="login" class="panel"><h2>採用担当者ログイン</h2><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password"><button id="signin">ログイン</button></section>
<section id="admin" class="hidden"><div class="panel"><p id="account"></p><button id="logout">ログアウト</button></div><div class="panel"><h2>求人の登録・編集</h2><form id="form"><label for="department">事業所</label><select id="department" required></select><label for="title">募集職種</label><input id="title" required maxlength="160"><label for="employment">雇用形態</label><input id="employment" maxlength="100"><label for="location">勤務地</label><input id="location" maxlength="200"><label for="description">仕事内容・応募条件</label><textarea id="description" maxlength="5000"></textarea><label><input type="checkbox" id="published" style="width:auto"> 公開フラグ（公開サイトへの掲載は未接続）</label><button id="save" type="submit">保存</button><button id="cancel" type="button">編集をやめる</button></form></div><div class="panel"><h2>登録済み求人</h2><div id="list"></div></div></section><div class="panel"><p id="status" role="status" aria-live="polite"></p></div></main>
<script>
'use strict';
const db=supabase.createClient('https://pagamoaxhqszojxrpxyu.supabase.co','sb_publishable_GQFRQYCo2oACYAh9lj9ZyA_JqfIPJGT');
const $=id=>document.getElementById(id);let departments=[],jobs=[],editing=null,authorized=false;
const status=s=>$('status').textContent=s;
function node(tag,content){const n=document.createElement(tag);if(content!==undefined)n.textContent=String(content??'');return n}
function reset(){editing=null;$('form').reset()}
function deny(){authorized=false;departments=[];jobs=[];$('admin').classList.add('hidden');$('login').classList.remove('hidden');$('list').replaceChildren()}
async function load(){const [ds,js]=await Promise.all([db.from('recruitment_departments').select('id,name').order('name'),db.from('recruitment_jobs').select('id,department_id,title,employment_type,location_text,description,is_published').order('created_at',{ascending:false})]);if(ds.error||js.error){deny();status('採用テーブルの設定または権限に問題があります。');return}departments=ds.data||[];jobs=js.data||[];const select=$('department');select.replaceChildren();for(const d of departments){const opt=new Option(d.name,d.id);select.add(opt)}$('save').disabled=!departments.length;render();status('採用情報を読み込みました。')}
function render(){const list=$('list');list.replaceChildren();if(!jobs.length)list.append(node('p','求人はまだ登録されていません。'));for(const j of jobs){const wrap=node('div');wrap.className='item';wrap.append(node('strong',j.title),node('p',(departments.find(d=>d.id===j.department_id)?.name||'事業所不明')+' / '+(j.is_published?'公開フラグあり':'下書き')));const edit=node('button','編集');edit.onclick=()=>{editing=j.id;$('department').value=j.department_id;$('title').value=j.title;$('employment').value=j.employment_type||'';$('location').value=j.location_text||'';$('description').value=j.description||'';$('published').checked=!!j.is_published;window.scrollTo({top:0,behavior:'smooth'})};wrap.append(edit);list.append(wrap)}}
async function init(){deny();const {data:{user},error}=await db.auth.getUser();if(error||!user){status('採用担当者でログインしてください。');return}const membership=await db.from('recruitment_admins').select('user_id').eq('user_id',user.id).eq('is_active',true).maybeSingle();if(membership.error){status('採用専用テーブルが未適用、または権限を確認できません。');return}if(!membership.data){status('BROOK本部の採用管理権限がありません。');return}authorized=true;$('login').classList.add('hidden');$('admin').classList.remove('hidden');$('account').textContent=user.email+'（採用管理者）';await load()}
$('signin').onclick=async()=>{const btn=$('signin');btn.disabled=true;try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){status('ログインに失敗しました。');return}await init()}finally{btn.disabled=false}};
$('logout').onclick=async()=>{await db.auth.signOut();deny();status('ログアウトしました。')};
$('cancel').onclick=reset;
$('form').onsubmit=async e=>{e.preventDefault();if(!authorized){status('採用管理権限がありません。');return}const data={department_id:$('department').value,title:$('title').value.trim(),employment_type:$('employment').value.trim(),location_text:$('location').value.trim(),description:$('description').value.trim(),is_published:$('published').checked};if(!data.department_id||!data.title){status('事業所と職種は必須です。');return}const btn=$('save');btn.disabled=true;try{const result=editing?await db.from('recruitment_jobs').update(data).eq('id',editing).select('id'):await db.from('recruitment_jobs').insert(data).select('id');if(result.error||!result.data?.length){status('保存できませんでした。権限・設定を確認してください。');return}reset();await load();status('求人を保存しました。')}finally{btn.disabled=false}};
init();
</script></body></html>
