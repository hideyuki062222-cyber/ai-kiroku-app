<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BROOK 求人編集デモ</title><style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f6f8fb;color:#182230;margin:0}main{max-width:900px;margin:30px auto;padding:16px}h1{font-size:26px}h2{font-size:19px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:20px;margin:14px 0}.warning{background:#fffaeb;border:1px solid #fedf89;padding:14px;border-radius:12px;color:#93370d}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}input,select,textarea{box-sizing:border-box;width:100%;font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}textarea{min-height:100px}button{font:inherit;padding:10px 14px;border:1px solid #344054;background:#344054;color:#fff;border-radius:9px;cursor:pointer;margin:4px 6px 4px 0}button.secondary{background:#fff;color:#344054}button.danger{background:#b42318;border-color:#b42318}.item{border-top:1px solid #e4e7ec;padding:14px 0}.muted{color:#667085;font-size:13px;line-height:1.6}.pill{font-size:12px;border-radius:999px;background:#eef2ff;padding:5px 9px}#status{min-height:20px}@media(max-width:650px){.row{grid-template-columns:1fr}main{margin:0;padding:12px}.card{padding:15px}}</style></head><body><main><h1>BROOK本部｜求人管理デモ</h1><div class="warning"><strong>本番管理画面ではありません。</strong> ログイン・Supabase連携はありません。入力した内容は、このブラウザ内だけに保存されます。個人情報や本番用の機密情報を入力しないでください。公開求人にも反映されません。</div>
<section class="card"><h2 id="form-title">求人を追加</h2><form id="job-form"><input type="hidden" id="edit-id"><div class="row"><div><label for="department">事業所</label><select id="department" required><option value="">選択してください</option><option>居宅介護KIZUNA</option><option>COZY</option><option>堺新事業所（開設予定）</option></select></div><div><label for="title">募集職種</label><input id="title" maxlength="120" required placeholder="例：訪問介護スタッフ"></div></div><div class="row"><div><label for="employment">雇用形態</label><select id="employment"><option>正社員</option><option>パート・アルバイト</option><option>その他・未定</option></select></div><div><label for="location">勤務地</label><input id="location" maxlength="160" placeholder="例：大阪市内"></div></div><label for="description">仕事内容・応募条件（案）</label><textarea id="description" maxlength="3000" placeholder="確定した情報だけ入力してください"></textarea><label for="state">管理上の状態</label><select id="state"><option value="draft">下書き</option><option value="ready">公開準備完了（デモ表示のみ）</option></select><p class="muted">「公開準備完了」にしても実際のサイトには公開されません。</p><button type="submit">この端末に保存</button><button type="button" class="secondary" id="reset">入力をクリア</button></form><p id="status" role="status"></p></section>
<section class="card"><h2>保存した求人</h2><label for="filter">事業所で絞り込み</label><select id="filter"><option value="">すべて</option><option>居宅介護KIZUNA</option><option>COZY</option><option>堺新事業所（開設予定）</option></select><div id="list"></div><button type="button" class="secondary" id="export">JSONバックアップを保存</button><p class="muted">ブラウザのデータを削除すると保存内容も失われます。JSONバックアップに個人情報を含めないでください。</p></section></main>
<script>
'use strict';
const KEY='brook_recruitment_jobs_demo_v1';
const $=id=>document.getElementById(id);
let jobs=[];
try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(raw))jobs=raw.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&typeof x.department==='string')}catch{ $('status').textContent='保存済みデータを読み込めませんでした。既存データは上書きしていません。';}
function save(){try{localStorage.setItem(KEY,JSON.stringify(jobs));return true}catch{$('status').textContent='保存できませんでした。端末の保存容量や設定を確認してください。';return false}}
function clearForm(){$('job-form').reset();$('edit-id').value='';$('form-title').textContent='求人を追加'}
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node}
function render(){const list=$('list');list.replaceChildren();const visible=jobs.filter(j=>!$('filter').value||j.department===$('filter').value);if(!visible.length){list.append(el('p','保存済み求人はありません。','muted'));return}for(const j of visible){const item=el('div',undefined,'item');item.append(el('span',j.state==='ready'?'公開準備完了（未公開）':'下書き','pill'),el('h3',j.title),el('p',j.department+' ／ '+j.employment+' ／ '+(j.location||'勤務地未入力'),'muted'),el('p',j.description||'仕事内容未入力','muted'));const edit=el('button','編集','secondary');edit.type='button';edit.onclick=()=>{for(const id of ['department','title','employment','location','description'])$(id).value=j[id]||'';$('state').value=j.state;$('edit-id').value=j.id;$('form-title').textContent='求人を編集';window.scrollTo({top:0,behavior:'smooth'})};const del=el('button','削除','danger');del.type='button';del.onclick=()=>{if(!confirm('この端末に保存した求人を削除しますか？'))return;const before=jobs;jobs=jobs.filter(x=>x.id!==j.id);if(!save())jobs=before;else{clearForm();render()}};item.append(edit,del);list.append(item)}}
$('job-form').onsubmit=e=>{e.preventDefault();const data={department:$('department').value,title:$('title').value.trim(),employment:$('employment').value,location:$('location').value.trim(),description:$('description').value.trim(),state:$('state').value};if(!data.department||!data.title){$('status').textContent='事業所と募集職種を入力してください。';return}const id=$('edit-id').value;const before=jobs.slice();if(id){const idx=jobs.findIndex(x=>x.id===id);if(idx<0){$('status').textContent='編集対象が見つかりません。';return}jobs[idx]={...jobs[idx],...data}}else{jobs.push({id:crypto.randomUUID(),...data})}if(!save()){jobs=before;return}$('status').textContent='この端末に保存しました（本番には反映されません）。';clearForm();render()};
$('reset').onclick=clearForm;$('filter').onchange=render;
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(jobs,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='brook-jobs-demo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></body></html>
