<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BROOK 採用管理ログイン試作</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f7fb;color:#182230}.wrap{max-width:880px;margin:35px auto;padding:16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:22px;margin-bottom:14px}input,button,select{font:inherit;padding:11px;border-radius:9px;border:1px solid #cbd5e1}input{display:block;width:100%;box-sizing:border-box;margin:8px 0 12px}button{background:#101828;color:white;cursor:pointer}button:disabled{opacity:.5}nav{display:flex;justify-content:space-between;gap:8px;align-items:center}small,.muted{color:#667085}#status{white-space:pre-wrap}table{border-collapse:collapse;width:100%}th,td{padding:10px;border-bottom:1px solid #eaecf0;text-align:left} .hidden{display:none} .notice{background:#fffaeb;padding:12px;border-radius:9px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script></head>
<body><main class="wrap"><nav><h1>BROOK 採用管理</h1><button id="logout" class="hidden">ログアウト</button></nav>
<div class="card notice">開発用プレビューです。本番データベースに採用テーブルが作成されるまで応募者情報の取得は行いません。</div>
<section class="card" id="login"><h2>採用担当者ログイン</h2><label>メールアドレス<input type="email" id="email" autocomplete="username"></label><label>パスワード<input type="password" id="password" autocomplete="current-password"></label><button id="signin">ログイン</button><p class="muted">既存のSupabaseアカウントで認証します。AI記録の管理者権限だけでは採用情報は見られません。</p></section>
<section class="card hidden" id="dashboard"><h2>本部採用ダッシュボード</h2><p id="welcome"></p><label>事業所<select id="department"><option value="">すべての事業所</option></select></label><h3>求人一覧</h3><div id="jobs">読み込み中…</div><h3>応募者一覧</h3><div id="applicants">読み込み中…</div><h3>学校への求人案内</h3><div id="schools">読み込み中…</div></section>
<div class="card"><p id="status" role="status"></p></div></main>
<script>
const db=supabase.createClient('https://pagamoaxhqszojxrpxyu.supabase.co','sb_publishable_GQFRQYCo2oACYAh9lj9ZyA_JqfIPJGT',{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const setStatus=message=>{$('status').textContent=message};
let jobs=[],applicants=[],schools=[],departments=[];
const cell=(tr,text)=>{const td=document.createElement('td');td.textContent=String(text??'');tr.append(td)};
function renderTable(el,headers,rows){el.replaceChildren();if(!rows.length){el.textContent='表示するデータはありません。';return}const table=document.createElement('table'),thead=document.createElement('thead'),hr=document.createElement('tr');headers.forEach(h=>{const th=document.createElement('th');th.textContent=h;hr.append(th)});thead.append(hr);table.append(thead);const tbody=document.createElement('tbody');rows.forEach(values=>{const tr=document.createElement('tr');values.forEach(v=>cell(tr,v));tbody.append(tr)});table.append(tbody);el.append(table)}
function render(){const dep=$('department').value;const j=jobs.filter(x=>!dep||x.department_id===dep);renderTable($('jobs'),['職種','事業所','公開'],j.map(x=>[x.title,departments.find(d=>d.id===x.department_id)?.name||'',x.is_published?'公開':'非公開']));const jobIds=new Set(j.map(x=>x.id));renderTable($('applicants'),['氏名','応募求人','進捗'],applicants.filter(a=>!dep||jobIds.has(a.job_id)).map(a=>[a.full_name,jobs.find(j=>j.id===a.job_id)?.title||'',a.status]));renderTable($('schools'),['学校名','送付状況'],schools.map(s=>[s.school_name,s.reply_status]))}
async function init(){try{const {data:{user},error}=await db.auth.getUser();if(error||!user){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');$('logout').classList.add('hidden');return}const m=await db.from('recruitment_admins').select('user_id,is_active').eq('user_id',user.id).eq('is_active',true).maybeSingle();if(m.error){setStatus('採用専用テーブルは未適用、または権限を確認できません。管理画面は開きません。');return}if(!m.data){setStatus('このアカウントにはBROOK本部の採用管理権限がありません。');return}
$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');$('welcome').textContent=user.email+' でログイン中';
const results=await Promise.all(['recruitment_departments','recruitment_jobs','recruitment_applicants','recruitment_school_contacts'].map(name=>db.from(name).select('*')));
const failed=results.find(r=>r.error);if(failed){setStatus('採用情報を取得できません。DB設定・RLSを確認してください。');return}
[departments,jobs,applicants,schools]=results.map(r=>r.data||[]);const select=$('department');select.replaceChildren(new Option('すべての事業所',''));departments.forEach(d=>select.add(new Option(d.name,d.id)));select.onchange=render;render();setStatus('採用情報を読み込みました。');
}catch(e){setStatus('読み込みに失敗しました。');}}
$('signin').onclick=async()=>{const button=$('signin');button.disabled=true;try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){setStatus('ログインできませんでした。');return}setStatus('');await init()}finally{button.disabled=false}};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};init();
</script></body></html>
