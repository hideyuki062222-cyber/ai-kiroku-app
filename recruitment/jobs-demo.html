<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BROOK採用センター｜画面デモ</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#172b4d;color:#fff;padding:26px 16px}header>div,main,footer{max-width:1000px;margin:auto}h1{font-size:clamp(24px,4vw,34px);margin:8px 0}h2{font-size:20px}.eyebrow{font-size:12px;letter-spacing:.1em;font-weight:700;color:#bed2fa}.lead{color:#d7e2f7;line-height:1.7}main{padding:20px 16px 45px}.alert{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:13px 15px;font-size:14px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.filters button{background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:11px 16px;font-weight:700;color:#344054;cursor:pointer}.filters button[aria-pressed=true]{background:#172b4d;color:#fff;border-color:#172b4d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:22px;box-shadow:0 2px 10px #10182806}.card h3{margin:8px 0 12px;font-size:20px}.tag{font-size:12px;background:#eef2ff;border-radius:20px;padding:5px 9px;color:#3730a3;font-weight:700}.muted{color:#667085;line-height:1.8;font-size:14px}.cta{border:0;border-radius:10px;padding:12px 16px;background:#98a2b3;color:white;font-weight:700;cursor:not-allowed}.details{margin-top:12px}.details summary{color:#175cd3;cursor:pointer;font-weight:700;padding:10px 0}footer{padding:0 16px 32px;color:#667085;font-size:12px}@media(max-width:680px){.grid{grid-template-columns:1fr}.card{padding:17px}}</style></head><body>
<header><div><div class="eyebrow">株式会社BROOK</div><h1>採用センター</h1><p class="lead">居宅介護KIZUNA・COZY・堺新事業所（開設予定）<br>各事業所の採用情報をまとめてご案内するための画面デモです。</p></div></header>
<main><div class="alert" role="note"><strong>開発中の画面デモです。</strong> 現在は求人を募集していません。給与・勤務時間・募集人数などは未確定で、応募ボタンは利用できません。</div>
<h2>事業所から探す</h2><div class="filters" role="group" aria-label="事業所で絞り込み"><button data-filter="all" aria-pressed="true">すべて</button><button data-filter="kizuna" aria-pressed="false">居宅介護KIZUNA</button><button data-filter="cozy" aria-pressed="false">COZY</button><button data-filter="sakai" aria-pressed="false">堺新事業所</button></div>
<div id="cards" class="grid" aria-live="polite"></div>
<section class="card" style="margin-top:18px"><h2>採用までの流れ（案）</h2><p class="muted">求人公開 → 応募 → 担当者からの連絡 → 面接 → 選考結果のご案内</p><p class="muted">応募受付の仕組みと個人情報の取扱いを確認した後に正式公開します。</p></section></main>
<footer>© BROOK / 採用ページ開発用プレビュー。実際の求人票ではありません。</footer>
<script>
const jobs=[{id:'kizuna',name:'居宅介護KIZUNA',title:'介護・障害福祉スタッフ',note:'居宅介護サービスのスタッフ募集ページを準備中です。'},{id:'cozy',name:'COZY',title:'生活支援スタッフ',note:'24時間対応の住まいでの支援業務について、募集内容を準備中です。'},{id:'sakai',name:'堺新事業所（開設予定）',title:'新規事業所スタッフ',note:'開設予定の新事業所に関する求人情報を準備中です。'}];
const cards=document.getElementById('cards');
function render(filter){cards.replaceChildren();for(const job of jobs.filter(j=>filter==='all'||j.id===filter)){const article=document.createElement('article');article.className='card';const tag=document.createElement('span');tag.className='tag';tag.textContent='募集内容確認中';const h=document.createElement('h3');h.textContent=job.name;const title=document.createElement('strong');title.textContent=job.title+'（職種案）';const p=document.createElement('p');p.className='muted';p.textContent=job.note;const d=document.createElement('details');d.className='details';const summary=document.createElement('summary');summary.textContent='現在の準備状況';const desc=document.createElement('p');desc.className='muted';desc.textContent='勤務地・給与・勤務時間・募集人数・応募条件は未確定です。正式な募集開始まで応募を受け付けません。';d.append(summary,desc);const button=document.createElement('button');button.className='cta';button.disabled=true;button.textContent='応募受付前';article.append(tag,h,title,p,d,button);cards.append(article)}}
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render(button.dataset.filter)}));render('all');
</script></body></html>
