<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>職員管理 | COZY支援システム</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}.wrap{max-width:760px;margin:auto;padding:14px 12px 70px}.top{background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:10}.topin{max-width:760px;margin:auto;padding:13px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:20px;font-weight:950}.back{color:#344054;text-decoration:none;background:#eef2f7;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:850}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 18px rgba(0,0,0,.06)}.title{font-size:17px;font-weight:950;margin-bottom:6px}.small{font-size:12px;color:#667085;line-height:1.6}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}input{flex:1;min-width:180px;border:1px solid #d0d7e2;border-radius:10px;padding:11px 12px;font-size:16px}.btn{border:0;border-radius:10px;padding:10px 13px;font-size:13px;font-weight:900;cursor:pointer;background:#eef2f7;color:#344054}.btn.primary{background:#111827;color:#fff}.btn.danger{background:#fee4e2;color:#b42318}.btn.green{background:#e9f8ef;color:#166534}.status{font-size:12px;color:#667085;min-height:18px;margin-top:8px}.staff{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;border-top:1px solid #edf0f4}.staff:first-child{border-top:0}.name{font-weight:900}.meta{font-size:11px;color:#667085;margin-top:3px}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#f2f4f7;color:#475467;font-size:10px;font-weight:900;margin-left:5px}.badge.off{background:#fff3cd;color:#8a5b00}.badge.stop{background:#fee4e2;color:#b42318}.actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.auth{position:fixed;inset:0;background:#f5f7fb;z-index:99;display:flex;align-items:center;justify-content:center;padding:18px}.authbox{width:min(430px,100%);background:#fff;border-radius:18px;padding:20px;box-shadow:0 12px 40px #0001}.authbox input{width:100%;margin:5px 0}.hidden{display:none!important}.empty{text-align:center;color:#667085;padding:22px 8px}@media(max-width:520px){.staff{align-items:flex-start}.actions{max-width:48%}.card{padding:13px}.brand{font-size:18px}}
</style>
</head>
<body>
<div id="auth" class="auth hidden"><div class="authbox"><h2>職員管理</h2><div class="small">管理者アカウントでログインしてください。</div><input id="email" type="email" placeholder="メールアドレス"><input id="password" type="password" placeholder="パスワード"><div class="row"><button class="btn primary" id="loginBtn">ログイン</button></div><div id="authStatus" class="status"></div></div></div>
<header class="top"><div class="topin"><div><div class="brand">職員管理</div><div id="orgName" class="small">事業所確認中…</div></div><a class="back" href="../assignment/">担当割当へ戻る</a></div></header>
<main id="app" class="wrap hidden">
<section class="card"><div class="title">メールアドレス無しのスタッフを追加</div><div class="small">ログインはできませんが、担当割当の担当者として選択できます。記録にはスタッフ名が残ります。</div><div class="row"><input id="newName" maxlength="80" placeholder="例：山田 太郎"><button class="btn primary" id="addBtn">追加</button></div><div id="addStatus" class="status"></div></section>
<section class="card"><div class="title">ログイン無しスタッフ</div><div class="small">停止すると新しい担当割当には表示されません。過去の担当記録の名前は残ります。</div><div id="list" style="margin-top:8px"></div><div id="listStatus" class="status"></div></section>
</main>
<script>
const CFG={url:'https://pagamoaxhqszojxrpxyu.supabase.co',key:'sb_publishable_GQFRQYCo2oACYAh9lj9ZyA_JqfIPJGT'};
const db=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let session=null,org=null,membership=null,rows=[];
async function login(){const {error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});$('#authStatus').textContent=error?error.message:'';if(!error)location.reload()}
$('#loginBtn').onclick=login;
async function init(){const {data:{session:s}}=await db.auth.getSession();session=s;if(!session){$('#auth').classList.remove('hidden');return}const {data:ms,error}=await db.from('organization_members').select('organization_id,role,staff_name,created_at').eq('user_id',session.user.id).order('created_at');if(error||!ms?.length){alert('事業所情報を確認できません。');return}const saved=localStorage.getItem('activeOrganizationId');membership=ms.find(x=>x.organization_id===saved)||ms.find(x=>x.role==='admin')||ms[0];if(membership.role!=='admin'){alert('職員管理は管理者のみ利用できます。');location.href='../assignment/';return}const {data:o,error:oe}=await db.from('organizations').select('id,name,is_active').eq('id',membership.organization_id).single();if(oe||!o){alert('事業所を確認できません。');return}org=o;localStorage.setItem('activeOrganizationId',org.id);$('#orgName').textContent=org.name;$('#app').classList.remove('hidden');await load();}
async function load(){const st=$('#listStatus');st.textContent='読み込み中…';const {data,error}=await db.from('organization_staff').select('id,staff_name,is_active,sort_order,created_at').eq('organization_id',org.id).order('is_active',{ascending:false}).order('sort_order').order('staff_name');if(error){st.textContent='読み込めませんでした：'+error.message;return}rows=data||[];render();st.textContent='';}
function render(){const box=$('#list');if(!rows.length){box.innerHTML='<div class="empty">まだ登録されていません。</div>';return}box.innerHTML=rows.map(x=>`<div class="staff"><div><div class="name">${esc(x.staff_name)} <span class="badge off">ログイン無し</span>${x.is_active?'':' <span class="badge stop">停止中</span>'}</div><div class="meta">担当割当用スタッフ</div></div><div class="actions"><button class="btn" onclick="renameStaff('${x.id}')">名前変更</button><button class="btn ${x.is_active?'danger':'green'}" onclick="toggleStaff('${x.id}',${!x.is_active})">${x.is_active?'停止':'再開'}</button><button class="btn" onclick="deleteStaff('${x.id}')">削除</button></div></div>`).join('')}
$('#addBtn').onclick=async()=>{const name=$('#newName').value.trim(),st=$('#addStatus');if(!name){st.textContent='スタッフ名を入力してください。';return}st.textContent='追加中…';const {error}=await db.from('organization_staff').insert({organization_id:org.id,staff_name:name,created_by:session.user.id});if(error){st.textContent='追加できませんでした：'+error.message;return}$('#newName').value='';st.textContent='追加しました。';await load();};
window.renameStaff=async id=>{const x=rows.find(r=>r.id===id);if(!x)return;const name=prompt('スタッフ名を変更',x.staff_name);if(name===null)return;const v=name.trim();if(!v)return alert('名前を入力してください。');const {error}=await db.from('organization_staff').update({staff_name:v,updated_at:new Date().toISOString()}).eq('id',id).eq('organization_id',org.id);if(error)return alert(error.message);await load();};
window.toggleStaff=async(id,next)=>{const {error}=await db.from('organization_staff').update({is_active:next,updated_at:new Date().toISOString()}).eq('id',id).eq('organization_id',org.id);if(error)return alert(error.message);await load();};
window.deleteStaff=async id=>{const x=rows.find(r=>r.id===id);if(!x||!confirm(`${x.staff_name} を削除しますか？\n過去の担当記録に保存済みの名前は残ります。`))return;const {error}=await db.from('organization_staff').delete().eq('id',id).eq('organization_id',org.id);if(error)return alert(error.message);await load();};
init();
</script>
</body>
</html>
