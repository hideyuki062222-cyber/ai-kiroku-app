$$('.tab').forEach(b=>b.onclick=()=>showV(b.dataset.v));function showV(id){$$('.view').forEach(v=>v.classList.toggle('on',v.id===id));$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===id));if(id==='histV')hist();if(id==='outV')printView();if(id==='clientsV')clientSettings()}function mname(x){return x?.staff_name?.trim()||'名称未設定'}function clabel(c){return `${c.code} ${c.display_name||''}`.trim()}function mt(t){const [h,m]=String(t).slice(0,5).split(':').map(Number);return h*60+m}function ord(t){let m=mt(t);return m>=1020?m:m<240?m+1440:m+2880}function ft(t){return String(t||'').slice(0,5).replace(/^0/,'')}function times(raw){let out=[];for(const p of String(raw||'').split(/[\/／,、\s]+/).filter(Boolean)){const m=p.match(/^(\d{1,2}):(\d{1,2})$/);if(!m||+m[1]>23||+m[2]>59)return null;let t=`${String(+m[1]).padStart(2,'0')}:${String(+m[2]).padStart(2,'0')}:00`;if(!out.includes(t))out.push(t)}return out.sort((a,b)=>mt(a)-mt(b))}

function fill(){let so='<option value="">担当者を選択</option>'+members.map(x=>`<option value="${x.user_id}">${E(mname(x))}</option>`).join('');$('#staff').innerHTML=$('#estaff').innerHTML=so;let co=clients.map(x=>`<option value="${x.id}">${E(clabel(x))}</option>`).join('');$('#aiClient').innerHTML=$('#pc').innerHTML=co;$('#hc').innerHTML='<option value="">すべて</option>'+co}function visible(){let d=new Date($('#date').value+'T12:00:00').getDay();return slots.filter(x=>(x.days_of_week||[]).includes(d)).sort((a,b)=>ord(a.service_time)-ord(b.service_time))}function renderSchedule(){let g={},arr=visible();arr.forEach(x=>(g[ft(x.service_time)]??=[]).push(x));let h='',phase='';for(const [t,it] of Object.entries(g)){let ph=ord(it[0].service_time)<2880?'夕方・夜間 17:00 ～ 翌3:59':'朝・日中 4:00 ～ 16:59';if(ph!==phase){h+=`<div class="section">${ph}</div>`;phase=ph}h+=`<div class="tr"><div class="tm">${t}</div><div class="slots">${it.map(slotHtml).join('')}</div></div>`}$('#schedule').innerHTML=h||'<div class="empty">この日の時間登録がありません。</div>';$$('.slot[data-id]').forEach(el=>el.onclick=e=>{if(e.target.closest('input,button'))return;let s=slots.find(x=>x.id===el.dataset.id),a=findA(s);if(a)return edit(a,s);selected.has(s.id)?selected.delete(s.id):selected.add(s.id);renderSchedule()});$$('.ed').forEach(b=>b.onclick=e=>{e.stopPropagation();let s=slots.find(x=>x.id===b.dataset.sid);edit(asg.find(x=>x.id===b.dataset.aid),s)});$$('.ai').forEach(b=>b.onclick=e=>{e.stopPropagation();let s=slots.find(x=>x.id===b.dataset.sid);openAI(asg.find(x=>x.id===b.dataset.aid),s)})}function findA(s){return asg.find(x=>x.client_id===s.client_id&&ft(x.service_time)===ft(s.service_time))}function slotHtml(s){let c=clients.find(x=>x.id===s.client_id),a=findA(s);if(!c)return'';return `<div class="slot ${a?'asg':''} ${selected.has(s.id)?'sel':''}" data-id="${s.id}"><div class="nm">${E(clabel(c))}</div><div class="sub">${a?`担当：${E(a.assigned_staff_name)}${a.memo?'<br>'+E(a.memo):''}`:'未登録'}</div>${a?`<div class="actions"> function openAI(a,s){active=a;$('#aiClient').value=s.client_id;$('#aiDate').value=a.service_date;$('#aiTime').value=ft(a.service_time);$('#alink').textContent=`担当：${a.assigned_staff_name} / メモ：${a.memo||'なし'}`;showV('aiV')}$('#aiClient').onchange=()=>{active=null;$('#alink').textContent=''};function checked(){return $$('input[name="svc"]:checked').map(x=>x.value)}$('#gen').onclick=()=>{let c=clients.find(x=>x.id===$('#aiClient').value);if(!c)return alert('利用者を選択してください。');let v='',sc=$('#scene').value,co=$('#cond').value,he=$('#health').value;if(sc)v+=`訪問時、${sc}。`;if(co)v+=`${co}。`;if(he)v+=`${he}。`;if(active?.memo)v+=`担当メモ「${active.memo}」を確認した。`;let cr='指示内容確認しました。前回のサービス記録確認しました。',sv=checked(),raw=$('#careIn').value.trim(),iv=$('#inter').value;if(sv.length)cr+=`${sv.join('、')}を実施した。`;if(raw)cr+=raw.replace(/。+$/,'')+'。';if(iv)cr+=`${iv}で、本人のペースと安全面に配慮して対応した。`;else cr+='本人のペースに合わせ、安全面に配慮して対応した。';if(c.support_method)cr+=`登録済みの支援方法も確認しながら対応した。`;$('#visitR').textContent=v||'状態・様子・体調を選択してください。';$('#careR').textContent=cr};$('#saveRec').onclick=async()=>{let cid=$('#aiClient').value,v=$('#visitR').textContent,cr=$('#careR').textContent;if(!cid||!v||!cr||v.includes('選択してください'))return alert('記録を作成してから保存してください。');let r=await sb.from('care_records').insert({organization_id:org.id,client_id:cid,created_by:ses.user.id,service_type:$('#stype').value,visit_scene:$('#scene').value,condition:$('#cond').value,health:$('#health').value,length_mode:'normal',services:checked(),care_input:$('#careIn').value.trim(),visit_note:v,care_note:cr,intervention_level:$('#inter').value,support_method_snapshot:clients.find(x=>x.id===cid)?.support_method||'',service_date:$('#aiDate').value,service_time:$('#aiTime').value||null,assignment_id:active?.id||null});if(r.error)return alert('保存できませんでした：'+r.error.message);alert('共有保存しました。')};
async function hist(){let q=sb.from('care_records').select('created_at,created_by,service_date,service_time,visit_note,care_note,client_id').eq('organization_id',org.id).order('created_at',{ascending:false}).limit(200),mo=$('#hm').value;if(mo){let [y,m]=mo.split('-').map(Number),end=new Date(y,m,1).toISOString().slice(0,10);q=q.gte('service_date',mo+'-01').lt('service_date',end)}if($('#hc').value)q=q.eq('client_id',$('#hc').value);let r=await q;if(r.error)return $('#hb').innerHTML=`<tr><td colspan="5">${E(r.error.message)}</td></tr>`;$('#hb').innerHTML=(r.data||[]).map(x=>{let c=clients.find(y=>y.id===x.client_id),m=members.find(y=>y.user_id===x.created_by);return `<tr><td>${E(x.service_date||x.created_at.slice(0,10))} ${E(ft(x.service_time||''))}</td><td>${E(c?clabel(c):'')}</td><td>${E(mname(m))}</td><td>${E(x.visit_note)}</td><td>${E(x.care_note)}</td></tr>`}).join('')||'<tr><td colspan="5">記録なし</td></tr>'}$('#searchH').onclick=hist;
function ct(cid){return slots.filter(x=>x.client_id===cid&&x.is_active).sort((a,b)=>mt(a.service_time)-mt(b.service_time)).map(x=>ft(x.service_time))}async function printView(){if(!org||!clients.length)return;let cid=$('#pc').value||clients[0].id;$('#pc').value=cid;let c=clients.find(x=>x.id===cid),mo=$('#pm').value||ym(),ts=ct(cid),[y,m]=mo.split('-').map(Number),last=new Date(y,m,0).getDate(),end=new Date(y,m,1).toISOString().slice(0,10),r=await sb.from('staff_assignments').select('*').eq('organization_id',org.id).eq('client_id',cid).gte('service_date',mo+'-01').lt('service_date',end);$('#ptitle').textContent=`${clabel(c)} ${y}年${m}月 担当表`;$('#ph').innerHTML='<tr><th>日付</th><th>曜</th>'+ts.map(t=>`<th>${t}</th>`).join('')+'</tr>';let dow=['日','月','火','水','木','金','土'],h='';for(let d=1;d<=last;d++){let da=`${mo}-${String(d).padStart(2,'0')}`;h+=`<tr><td>${m}/${d}</td><td>${dow[new Date(da+'T12:00:00').getDay()]}</td>`+ts.map(t=>{let a=(r.data||[]).find(x=>x.service_date===da&&ft(x.service_time)===t);return `<td>${a?`<b>${E(a.assigned_staff_name)}</b>${a.memo?'<br>'+E(a.memo):''}`:''}</td>`}).join('')+'</tr>'}$('#pb').innerHTML=h}$('#pc').onchange=printView;$('#pm').onchange=printView;$('#printB').onclick=()=>window.print();
function clientSettings(){if(!clients.length)return $('#cset').innerHTML='<div class="empty">利用者なし</div>';$('#cset').innerHTML=clients.map(c=>`<div class="client"><b>${E(clabel(c))}</b><div class="g3" style="margin-top:8px"><div><label>コード</label><input data-co="${c.id}" value="${E(c.code)}"></div><div><label>氏名</label><input data-na="${c.id}" value="${E(c.display_name||'')}"></div><div><label>時間</label><input data-ti="${c.id}" value="${E(ct(c.id).join(' / '))}"></div></div><div class="actions"><button class="p" data-sc="${c.id}">変更保存</button><button class="d" data-dc="${c.id}">利用者を削除</button></div></div>`).join('');$$('[data-sc]').forEach(b=>b.onclick=()=>saveC(b.dataset.sc));$$('[data-dc]').forEach(b=>b.onclick=()=>delC(b.dataset.dc))}async function syncT(cid,ts){let ex=slots.filter(x=>x.client_id===cid),want=ts.map(x=>ft(x)),del=ex.filter(x=>!want.includes(ft(x.service_time))).map(x=>x.id);if(del.length){let r=await sb.from('client_service_slots').delete().in('id',del);if(r.error)throw r.error}let rows=ts.map(t=>{let e=ex.find(x=>ft(x.service_time)===ft(t));return{organization_id:org.id,client_id:cid,service_time:t,days_of_week:e?.days_of_week||[0,1,2,3,4,5,6],label:e?.label||'',note:e?.note||'',is_active:true,sort_order:ord(t)}});if(rows.length){let r=await sb.from('client_service_slots').upsert(rows,{onConflict:'organization_id,client_id,service_time'});if(r.error)throw r.error}}async function saveC(id){try{let ts=times(document.querySelector(`[data-ti="${id}"]`).value);if(!ts)return alert('時間形式を確認してください。');let r=await sb.from('clients').update({code:document.querySelector(`[data-co="${id}"]`).value.trim(),display_name:document.querySelector(`[data-na="${id}"]`).value.trim(),updated_at:new Date().toISOString()}).eq('id',id);if(r.error)throw r.error;await syncT(id,ts);await loadAll();alert('変更しました')}catch(e){alert(e.message)}}async function delC(id){let c=clients.find(x=>x.id===id);if(!confirm(`${clabel(c)}を削除しますか？過去記録は残します。`))return;let r=await sb.from('clients
