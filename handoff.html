<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>申し送り</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;background:#f5f6f8;margin:0;color:#222}.wrap{max-width:680px;margin:auto;padding:18px}h1{font-size:28px}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}button{width:100%;font-size:22px;font-weight:700;padding:20px;margin:8px 0;border:0;border-radius:14px;background:#1769e0;color:white}.secondary{background:#555}.danger{background:#b42318}.night{color:#b42318}.day{color:#111}textarea,input,select{box-sizing:border-box;width:100%;font-size:20px;padding:14px;border:1px solid #bbb;border-radius:10px;margin:7px 0}textarea{min-height:150px}.small{font-size:15px;color:#666}.item{border-top:1px solid #ddd;padding:14px 0;font-size:19px}.hidden{display:none}.listbtn{background:#16794a}</style></head><body><main class="wrap"><h1>申し送り</h1><section id="home" class="card"><button onclick="startEntry()">🎤 話して入力する</button><button class="listbtn" onclick="showList()">📋 今日の申し送りを見る</button></section><section id="entry" class="card hidden"><label>勤務帯</label><select id="shift"><option value="日勤">日勤</option><option value="夜勤">夜勤</option></select><label>職員名</label><input id="staff" placeholder="名前"><button id="mic" onclick="listen()">🎤 音声入力を開始</button><p id="status" class="small">利用者番号・名前と、普段と違うことをそのまま話してください。</p><textarea id="text" placeholder="例：203の金本さんが下痢気味でした。403の方がアトピーが出たので塗り薬お願いします"></textarea><button onclick="confirmEntry()">内容を確認する</button><button class="secondary" onclick="home()">戻る</button></section><section id="confirm" class="card hidden"><h2>この内容でよろしいですか？</h2><div id="preview" style="white-space:pre-wrap;font-size:20px"></div><button onclick="save()">登録する</button><button class="secondary" onclick="editAgain()">一部だけ修正する</button><button class="danger" onclick="redo()">やり直す</button></section><section id="list" class="card hidden"><h2>今日の申し送り</h2><div id="items"></div><button class="secondary" onclick="home()">戻る</button></section></main><script>const $=id=>document.getElementById(id);function screen(id){['home','entry','confirm','list'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function home(){screen('home')}function startEntry(){screen('entry')}function clean(t){return t.replace(/えーっと|えっと|あのー|あの/g,'').replace(/ギリ気味/g,'下痢気味').replace(/\s+/g,' ').trim()}function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('status').textContent='このブラウザでは音声入力が使えません。下の欄に入力してください。';return}const r=new SR();r.lang='ja-JP';r.interimResults=false;r.continuous=false;$('status').textContent='聞いています…そのまま話してください。';r.onresult=e=>{$('text').value=clean(e.results[0][0].transcript);$('status').textContent='聞き取りました。内容を確認してください。'};r.onerror=()=>{$('status').textContent='聞き取れませんでした。もう一度押してください。'};r.onend=()=>{if($('status').textContent.startsWith('聞いています'))$('status').textContent='音声入力が終了しました。'};r.start()}function confirmEntry(){let t=clean($('text').value);if(!t){alert('申し送り内容を話すか入力してください');return}$('text').value=t;$('preview').textContent=t;screen('confirm')}function editAgain(){screen('entry');$('text').focus()}function redo(){$('text').value='';screen('entry')}function save(){const a=JSON.parse(localStorage.getItem('handoffs')||'[]');a.unshift({text:$('text').value,shift:$('shift').value,staff:$('staff').value||'未入力',time:new Date().toISOString()});localStorage.setItem('handoffs',JSON.stringify(a));$('text').value='';showList()}function showList(){const a=JSON.parse(localStorage.getItem('handoffs')||'[]'),today=new Date().toLocaleDateString('ja-JP');const rows=a.filter(x=>new Date(x.time).toLocaleDateString('ja-JP')===today);$('items').innerHTML=rows.length?rows.map(x=>`<div class="item ${x.shift==='夜勤'?'night':'day'}"><b>${x.shift}　${new Date(x.time).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}　${esc(x.staff)}</b><br>${esc(x.text)}</div>`).join(''):'<p>今日の申し送りはまだありません。</p>';screen('list')}function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}</script></body></html>
